<title>디지몬 판정 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Do+Hyeon&display=swap">
<style>
/* Layout: one narrow column that reads top to bottom — 1 카드 → 2 질문 → 판정 → 결과(근거 탭). Card browsing sits at the end. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#151b26; --muted:#5f6b7c; --faint:#8a95a5; --line:#dde2ea; --line2:#c9d0db;
  --accent:#e2560f; --accent-ink:#ffffff; --accent-soft:#fdeadf;
  --ok:#17794a; --ok-soft:#e1f3e9; --warn:#946200; --warn-soft:#fff1cf; --ai:#2b5fc4; --ai-soft:#e5edfc; --none:#5f6b7c; --none-soft:#eceff3;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d26; --ink:#e6eaf0; --muted:#9aa6b6; --faint:#6f7b8b; --line:#27303c; --line2:#34404e;
  --accent:#ff7a3a; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#5fd39a; --ok-soft:#12301f; --warn:#f2c14e; --warn-soft:#3a2f12; --ai:#86a9ff; --ai-soft:#1a2747; --none:#9aa6b6; --none-soft:#1f2732; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d26; --ink:#e6eaf0; --muted:#9aa6b6; --faint:#6f7b8b; --line:#27303c; --line2:#34404e;
  --accent:#ff7a3a; --accent-ink:#1a0d05; --accent-soft:#3a2216;
  --ok:#5fd39a; --ok-soft:#12301f; --warn:#f2c14e; --warn-soft:#3a2f12; --ai:#86a9ff; --ai-soft:#1a2747; --none:#9aa6b6; --none-soft:#1f2732; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top .wrap{padding-block:22px 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0}
h1 b{color:var(--accent);font-weight:400}
.tagline{color:var(--muted);font-size:13.5px}
main .wrap{padding-block:12px 80px;display:grid;gap:14px}

/* steps */
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;min-width:0}
.step-h{display:flex;align-items:center;gap:10px}
.step-h .no{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--f-num);font-size:13px;flex:none}
.step-h h2{margin:0;font-size:16px;font-weight:700}
.step-h .side{margin-left:auto;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.linkbtn:hover{color:var(--accent)}

/* card search */
.combo{position:relative}
.field{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);outline:none}
.field:focus{border-color:var(--accent)}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);max-height:min(340px,55vh);overflow-y:auto;margin:0;padding:4px;list-style:none}
.ac li{display:flex;gap:12px;align-items:baseline;padding:7px 10px;border-radius:7px;cursor:pointer;min-width:0}
.ac li .cno{font-family:var(--f-num);font-size:13px;color:var(--accent);flex:none;min-width:6.4em}
.ac li .cnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ac li .cty{margin-left:auto;font-size:12px;color:var(--faint);flex:none}
.ac li[aria-selected="true"]{background:var(--accent-soft)}
.ac li mark{background:none;color:var(--accent);font-weight:700}
.ac .hint{color:var(--muted);font-size:13px;cursor:default}

/* chosen cards */
.cards{display:grid;gap:10px}
.cardbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cardbox.main{border-color:var(--accent)}
.cb-h{display:flex;align-items:baseline;gap:10px;padding:9px 12px;background:var(--bg);flex-wrap:wrap}
.cardbox.main .cb-h{background:var(--accent-soft)}
.role{font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:4px;background:var(--surface);color:var(--muted)}
.cardbox.main .role{background:var(--accent);color:var(--accent-ink)}
.cb-h .cno{font-family:var(--f-num);color:var(--accent);font-size:14px}
.cb-h .cnm{font-weight:700}
.cb-h .cty{font-size:12.5px;color:var(--muted)}
.cb-h .acts{margin-left:auto;display:flex;gap:12px}
.effs{display:grid}
.eff{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.eff:hover{background:var(--bg)}
.eff input{margin:4px 0 0;accent-color:var(--accent)}
.eff .et{overflow-wrap:anywhere;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eff.on{background:var(--accent-soft)}
.eff.on .et{-webkit-line-clamp:unset;display:block}
.tm{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:4px}
.extra-sel{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.extra-sel select{font:inherit;font-size:13.5px;flex:1;min-width:0;padding:4px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--ink)}
.addrow{display:flex;gap:8px;align-items:center}
.addbtn{border:1px dashed var(--line2);background:none;border-radius:10px;padding:9px 14px;cursor:pointer;color:var(--muted);font-size:14px;width:100%;text-align:left}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.paste textarea{width:100%;min-height:90px;font:inherit;font-size:14.5px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}

/* question */
textarea.q{width:100%;min-height:96px;font:inherit;font-size:16px;line-height:1.6;padding:12px 14px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;outline:none}
textarea.q:focus{border-color:var(--accent)}
.meta{display:grid;gap:8px}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.mrow>.k{color:var(--muted);min-width:4.2em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:2px 4px 2px 10px;background:var(--bg);border:1px solid var(--line)}
.pill button{border:0;background:none;cursor:pointer;color:var(--faint);padding:0 5px;font-size:14px;line-height:1}
.pill button:hover{color:var(--accent)}
.pill.g{padding-right:10px;color:var(--faint)}
select.it{font:inherit;font-size:13.5px;padding:3px 8px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--ink)}
.picker{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.prow{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.prow>b{color:var(--muted);font-weight:500;padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:12.5px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* go */
.gobar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:13px 30px;cursor:pointer}
.go:disabled{background:var(--line2);color:var(--muted);cursor:default}
.gohint{font-size:13px;color:var(--muted)}

/* result */
.result{display:grid;gap:12px}
.verdict{border-radius:var(--r);padding:18px 20px;display:grid;gap:6px;border:1px solid transparent}
.verdict .badge{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 10px}
.verdict .ans{font-family:var(--f-display);font-size:44px;line-height:1.05}
.verdict .why{font-size:14.5px}
.verdict .sub{font-size:13px;color:var(--muted)}
.verdict .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.v-sure{background:var(--ok-soft)} .v-sure .badge{background:var(--ok);color:var(--surface)} .v-sure .ans{color:var(--ok)}
.v-ref{background:var(--warn-soft)} .v-ref .badge{background:var(--warn);color:var(--surface)} .v-ref .ans{color:var(--warn)}
.v-ai{background:var(--ai-soft)} .v-ai .badge{background:var(--ai);color:var(--surface)} .v-ai .ans{color:var(--ai)}
.v-none{background:var(--none-soft)} .v-none .badge{background:var(--none);color:var(--surface)}
.btn2{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:6px 14px;cursor:pointer;font-size:14px}
.btn2.pri{background:var(--ai);border-color:var(--ai);color:var(--surface);font-weight:700}
.reasons{margin:4px 0 0;padding-left:22px;display:grid;gap:4px}
.cite{font-family:var(--f-num);font-size:11.5px;border:1px solid var(--ai);color:var(--ai);background:var(--surface);border-radius:4px;padding:0 5px;margin:0 2px;cursor:pointer;vertical-align:1px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ai);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* evidence tabs */
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-size:14px;border-bottom:3px solid transparent}
.tabs button .n{font-family:var(--f-num);font-size:12px;margin-left:4px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tabp{padding:12px 14px;display:grid;gap:8px}
.item{border-radius:9px;background:var(--bg);padding:9px 12px;display:grid;gap:3px;min-width:0;scroll-margin-top:20px}
.item.flash{outline:2px solid var(--ai)}
.item .src{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.item .src .cno{font-family:var(--f-num);color:var(--accent)}
.item .src .yn{font-weight:700;color:var(--ink)}
.item .q,.item .a{display:grid;grid-template-columns:1.4em minmax(0,1fr);gap:4px;overflow-wrap:anywhere}
.item .q b{color:var(--accent);font-family:var(--f-num);font-size:13px}
.item .a b{color:var(--ai);font-family:var(--f-num);font-size:13px}
.item .q{font-weight:500}
.item .tx{overflow-wrap:anywhere;white-space:pre-line}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.grp-h{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:12.5px;color:var(--muted)}
.grp-h b{color:var(--ink);font-size:13.5px}.grp-h .yn{color:var(--ink);font-weight:700}
.grp-q{font-weight:500;font-size:14px}
.grp details summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:2px 0}
.grp details[open]{display:grid;gap:6px}

/* examples & browse */
.exs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.exs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px;color:var(--ink)}
.exs button:hover{border-color:var(--accent)}
.exs .lv{font-size:11px;font-weight:700;margin-right:4px}
.lv-확정{color:var(--ok)} .lv-참고{color:var(--warn)} .lv-선례{color:var(--ai)}
details.browse{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.browse>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:14.5px}
details.browse>div{padding:0 16px 16px;display:grid;gap:12px}
/* legacy card-evidence view (reused) */
.unit{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.uhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;background:var(--bg);border-radius:6px;padding:1px 8px;border:0}
.chip.k{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip.p,.chip.ask{border:1px solid var(--line2);background:var(--surface);cursor:pointer}
.utext{overflow-wrap:anywhere}
.ntext,.note{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
details.sec{border-top:1px solid var(--line);padding-top:6px}
details.sec>summary{cursor:pointer;font-weight:700;font-size:13.5px}
details.sec>summary .n{font-family:var(--f-num);font-size:12px;color:var(--accent);margin-left:4px}
details.sec>summary .why{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.list{display:grid;gap:6px;margin-top:6px}
.qa{display:grid;gap:3px;padding:8px 10px;border-radius:8px;background:var(--bg);min-width:0}
.qa .src{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.qa .src button,.cards-mini button{font-family:var(--f-num);font-size:12px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.qa .q,.qa .a{display:grid;grid-template-columns:1.4em minmax(0,1fr);gap:4px;overflow-wrap:anywhere}
.qa .q b{color:var(--accent);font-family:var(--f-num);font-size:13px}.qa .a b{color:var(--ai);font-family:var(--f-num);font-size:13px}
.rule{padding:8px 10px;border-radius:8px;background:var(--bg);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;min-width:0}
.rule .rn{font-family:var(--f-num);color:var(--accent);font-size:13px}
.rule .rt{overflow-wrap:anywhere}
.rule .kids{grid-column:2;font-size:13px;color:var(--muted);display:grid;gap:2px}
.tag-est{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px}
.more{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:3px 12px;cursor:pointer;font-size:13px;justify-self:start}
.cards-mini{display:flex;flex-wrap:wrap;gap:8px}
.cardhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cardhead h2{margin:0;font-size:18px}.cardhead .no{font-family:var(--f-num);color:var(--accent)}
@media (max-width:600px){h1{font-size:24px}.verdict .ans{font-size:36px}.go{width:100%}.prow{grid-template-columns:minmax(0,1fr)}}
table.struct{border-collapse:collapse;width:100%;font-size:13.5px}table.struct th{text-align:left;vertical-align:top;white-space:nowrap;padding:7px 12px 7px 0;color:var(--muted);font-weight:600;width:1%}
table.struct td{padding:7px 0;border-top:1px solid var(--line,rgba(0,0,0,.08))}table.struct th{border-top:1px solid var(--line,rgba(0,0,0,.08))}table.struct .ref{display:block;font-weight:400;font-size:11.5px;opacity:.8}
table.struct ol{margin:0;padding-left:18px}table.struct .no{color:var(--muted)}
.conf{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:6px 0 2px;padding:7px 10px;border-radius:8px;font-size:13.5px}
.conf b{font-size:15px}.conf span{flex-basis:100%;font-size:12px;opacity:.8}
.conf.hi{background:color-mix(in srgb,#2e8b57 14%,transparent)}.conf.lo{background:color-mix(in srgb,#d9822b 18%,transparent)}
.crbar{margin:8px 0 12px;padding:10px 12px;border:1px dashed var(--line,#ccc);border-radius:10px;font-size:14px}.crbar.ok{border-style:solid}.crbar .crq{margin-bottom:6px}.crbar .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.crbar input{flex:1 1 180px;min-width:0;padding:6px 8px;border:1px solid var(--line,#ccc);border-radius:8px;background:transparent;color:inherit;font:inherit}
.crcode,#crin{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:6px 8px;border:1px solid var(--line,#ccc);border-radius:8px;background:transparent;color:inherit;font:12px/1.4 ui-monospace,monospace;word-break:break-all}
.sugg{margin:6px 0 0;border:1px solid var(--line,#ccc);border-radius:10px;overflow:hidden;background:var(--card,transparent)}.sugg-h{font-size:12px;color:var(--muted,#777);padding:6px 10px}.sugg .sg{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-top:1px solid var(--line,#ddd);background:transparent;color:inherit;font:inherit;font-size:14px;line-height:1.45;cursor:pointer}.sugg .sg:hover,.sugg .sg.on{background:color-mix(in srgb,currentColor 7%,transparent)}.sugg .sg-src{display:block;font-size:11px;color:var(--muted,#777);margin-bottom:2px}
</style>

<header class="top"><div class="wrap"><h1>디지몬 <b>판정 도우미</b></h1><span class="tagline">같은 선례가 있으면 바로, 없으면 Claude가 근거를 찾아 판정합니다</span></div></header>
<main><div class="wrap">
  <div class="exs" id="exs"></div>

  <section class="step" aria-labelledby="h1s">
    <div class="step-h"><span class="no">1</span><h2 id="h1s">카드와 효과</h2><span class="side"><button class="linkbtn" type="button" id="pastetoggle">카드 대신 효과 문구로</button></span></div>
    <div id="cardsec"></div>
  </section>

  <section class="step" aria-labelledby="h2s">
    <div class="step-h"><span class="no">2</span><h2 id="h2s">질문</h2></div>
    <textarea class="q" id="askq" placeholder="상황을 문장으로 적어 주세요. 예) 이 카드의 효과로 육성 에어리어에 디지몬을 등장시켰을 때, 상대의 「디지몬이 등장했을 때」 효과는 발휘되나요?" aria-label="질문"></textarea>
    <div class="meta" id="meta"></div>
  </section>

  <div class="gobar"><button class="go" type="button" id="go" disabled>판정하기</button><span class="gohint" id="gohint"></span></div>

  <div class="result" id="result" aria-live="polite"></div>

  <details class="browse" id="browse"><summary>카드 효과·근거 전체 보기</summary><div id="out"></div></details>
</div></main>
