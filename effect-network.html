<style>
/* Layout: header + controls row; network canvas (left, flexible) beside a detail panel (right); stacks on phones */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#151b26; --muted:#5f6b7c; --faint:#8a95a5; --line:#dde2ea; --link:#b9c2cf; --accent:#e2560f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --other:#a7b0bd;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif; --f-body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d26; --ink:#e6eaf0; --muted:#9aa6b6; --faint:#6f7b8b; --line:#27303c; --link:#3a4554; --accent:#ff7a3a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --other:#56606d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d26; --ink:#e6eaf0; --muted:#9aa6b6; --faint:#6f7b8b; --line:#27303c; --link:#3a4554; --accent:#ff7a3a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --other:#56606d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{padding-block:18px 8px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
h1 b{color:var(--accent);font-weight:400}
.sub{color:var(--muted);font-size:13px}
.bar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.tog label{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);cursor:pointer}
.search{position:relative;margin-left:auto;min-width:0}
.search input{width:min(280px,70vw);padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.main .wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding-block:0 30px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative;min-width:0;height:min(76vh,760px);overflow:hidden}
.stage svg{width:100%;height:100%;display:block;cursor:grab}
.legend{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:9px;padding:6px 8px;display:grid;gap:2px;max-width:min(320px,70%);font-size:12px}
.legend button{display:flex;gap:6px;align-items:center;border:0;background:none;padding:1px 2px;cursor:pointer;text-align:left;border-radius:4px}
.legend button[aria-pressed="true"]{background:var(--bg);font-weight:700}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.hint{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--faint)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;max-width:300px;line-height:1.45;opacity:0;transition:opacity .1s}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0;max-height:min(76vh,760px);overflow-y:auto}
.panel h2{margin:0;font-size:16px}
.panel .k{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:var(--bg);border-radius:8px;padding:6px 8px}
.stats b{display:block;font-family:var(--f-num);font-size:16px}
.stats span{font-size:11.5px;color:var(--muted)}
.lst{display:grid;gap:4px}
.lst button,.lst div{text-align:left;border:0;background:var(--bg);border-radius:7px;padding:5px 8px;cursor:pointer;font-size:13px;overflow-wrap:anywhere}
.lst button:hover{outline:1px solid var(--accent)}
.lst .w{font-family:var(--f-num);color:var(--muted);font-size:11.5px;margin-left:6px}
.qa{display:grid;gap:2px;background:var(--bg);border-radius:7px;padding:6px 8px;font-size:13px}
.qa b{color:var(--accent);font-family:var(--f-num)}
.cards{display:flex;flex-wrap:wrap;gap:4px}
.cards span{font-size:12px;background:var(--bg);border-radius:5px;padding:1px 6px}
.cards span em{font-style:normal;font-family:var(--f-num);color:var(--accent);margin-right:4px}
.empty{color:var(--muted);font-size:13.5px}
details.tbl summary{cursor:pointer;font-size:13px;color:var(--muted)}
table{border-collapse:collapse;font-size:12.5px;width:100%}
td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}
td.n{font-family:var(--f-num);text-align:right}
@media (max-width:900px){.main .wrap{grid-template-columns:minmax(0,1fr)}.stage{height:62vh}.panel{max-height:none}.search{margin-left:0;width:100%}.search input{width:100%}}
</style>

택하여 「BT17-023 가름몬」 【어택 시】효과로 이 카드로 진화했습니다. 이때","아니요, 소멸하지 않습니다. 특정한 타이밍이 되었을 때 처리하는 효과는 그 타이밍이 된 시점에 유발과 동시에 처리합니다. 턴 종료 시에 이 카드의 효과로 진화한 경우는 턴 종료 시가 되는 타이밍을 지나쳐 있기 때문에"]],"rules":[["15-3","진화원 효과"],["15-16-5","【어택 시】"],["4-14","드로우"],["15-14-1","[턴 X회]"],["15-6","처리 조건"]]},{"id":"P160","p":160,"size":8,"cards":8,"qa":16,"label":"【서로의 턴】 상대는 테이머의 효과 이외로 메모리를 플러스할 수 없다.","types":"기타(행동 미분류)","sub":"【서로의 턴】","comm":10,"pr":3.293,"cardList":[["BT18-009","원시고부리몬"],["BT18-059","제니몬"],["BT3-046","테리어몬"],["BT3-061",""],["BT3-077","가지몬"],["BT6-021","투베타몬"],["EX8-030","테이파몬"],["ST21-02","쉬라몬"]],"qaList":[["ST21-02","「상대는 테이머 효과 이외로 메모리를 플러스할 수 없다」는 어떤 효과입니까?","상대는 테이머 효과를 제외하고, 모든 효과로는 메모리를 플러스할 수 없게 되는 효과입니다. 이 효과는 상대 플레이어에 영향을 미칩니다."],["ST21-02","상대의 「상대는 테이머 효과 이외로 메모리를 플러스할 수 없다」 효과가 발휘 중인 동안, 「디지몬・DP X000로도 취급한다」 효과로 디지몬으로서 취급하고 있는 테이머 효과로 메모리를 플러스할 수 있습니까?","네, 메모리를 플러스할 수 있습니다. 디지몬 및 테이머로서 취급하고 있는 카드가 발휘한 효과는 디지몬의 효과와 테이머 효과의 양쪽을 포함했기 때문에 메모리를 플러스할 수 있습니다."],["BT3-061","상대 쪽에 이 디지몬이 있을 때, 「BT1-090 그래비티 프레스」, 「BT1-021 메탈그레이몬」, 「BT1-040 워가루몬」, 「BT1-058 치린몬」, 「BT1-075 디지타몬」 등, 발휘 시에 메모리를 플러스하고 턴 종료 시에 메모리를 마이너스","디지몬, 옵션 카드의 효과로는 메모리를 플러스할 수 없지만, 마이너스하는 효과는 그대로 발휘하기 때문에 턴 종료 시에 메모리가 각각의 효과로 지정된 개수만큼 마이너스되게 됩니다."],["BT3-061","상대 쪽에 이 디지몬이 있을 때, 「ST2-13 해머 스파크」의 시큐리티 효과로도 메모리는 플러스되지 않게 되는 것입니까?","네, 시큐리티 효과로도 메모리는 플러스되지 않습니다."],["BT3-046","상대 쪽에 이 디지몬이 있을 때, 「BT1-090 그래비티 프레스」, 「BT1-021 메탈그레이몬」, 「BT1-040 워가루몬」, 「BT1-058 치린몬」, 「BT1-075 디지타몬」 등, 발휘 시에 메모리를 플러스하고 턴 종료 시에 메모리를 마이너스","디지몬, 옵션 카드의 효과로는 메모리를 플러스할 수 없지만, 마이너스하는 효과는 그대로 발휘하기 때문에 턴 종료 시에 메모리가 각각의 효과로 지정된 개수만큼 마이너스됩니다."],["BT3-046","상대 쪽에 이 디지몬이 있을 때, 「ST2-13 해머 스파크」의 시큐리티 효과로도 메모리는 플러스되지 않나요?","네, 시큐리티 효과로도 메모리는 플러스되지 않습니다."]],"rules":[["15-16-9","【서로의 턴】"]]},{"id":"P87","p":87,"size":15,"cards":15,"qa":11,"label":"【소멸 시】자신의 트래시에서 「길몬」 또는 명칭에 「그라우몬」/「듀크몬」을 포함하는 카드 1장을 패로 되돌릴 수 있다.","types":"패로 회수","sub":"【소멸 시】","comm":3,"pr":0.8,"cardList":[["BT11-071","무소나이트몬"],["BT12-015","아루다몬"],["BT19-006","퍼그몬"],["BT20-006","푸  않는 디지몬을 선택할 수 있습니다."],["ST20-11","「효과를 받지 않는다」 효과를 가진 카드에 효과를 부여할 수 있습니까?","네, 부여할 수 있습니다. 효과의 영향은 받지 않습니다만, 효과를 부여할 수 있습니다. 단, 효과를 받지 않는 디지몬에게 ≪S 어택≫ 등을 부여해도 그 효과를 가진 것으로는 취급하지 않습니다."],["ST20-11","효과가 부여되어 있는 카드가 나중에 「효과를 받지 않는다」 효과를 얻은 경우, 부여되어 있는 효과는 어떻게 됩니까?","효과를 받지 않게 된 시점부터 부여되어 있는 효과의 영향을 받지 않게 됩니다."],["ST20-11","효과가 부여되어 있는 「효과를 받지 않는다」 효과를 가진 카드가 나중에 「효과를 받지 않는다」 효과를 잃은 경우, 부여되어 있는 효과는 어떻게 됩니까?","효과를 받게 된 시점부터 부여되어 있는 효과의 영향을 받습니다."]],"rules":[["15-16-3","【진화 시】"],["15-15-5","「효과를 받지 않는」 카드"],["15-16-2","【등장 시】"],["4-27","「마다」"]]},{"id":"P213","p":213,"size":6,"cards":6,"qa":1,"label":"【등장 시】【진화 시】가장 DP가 낮은 상대의 디지몬 1마리를 소멸시킨다.","types":"소멸","sub":"【등장 시+진화 시】","comm":6,"pr":1.507,"cardList":[["BT18-017","에이션트볼케몬"],["BT20-079","네크로몬"],["BT21-027","샤우트몬 DX"],["BT22-015","오메가몬"],["EX7-014","볼케닉드라몬"],["ST20-11","워그레이몬 ACE"]],"qaList":[["ST20-11","「효과를 받지 않는다」 효과를 가진 카드에 【어택 시】 효과 등의 유발하는 효과를 부여했습니다. 그 뒤에 그 카드가 그 효과의 유발 조건을 만족한 경우, 그 효과는 유발합니까?","유발하는 타이밍에 그 디지몬이 효과를 받지 않는 경우는 그 효과는 유발하지 않습니다."]],"rules":[["4-15","소멸"],["15-16-2","【등장 시】"],["15-16-3","【진화 시】"],["15-16-5","【어택 시】"]]},{"id":"P25","p":25,"size":43,"cards":43,"qa":1,"label":"《관통》(어택 중인 이 디지몬이 배틀에서 상대의 디지몬을 소멸시켰을 때, 어택 종료 전에 체크한다)","types":"키워드 · 《관통》","sub":"","comm":0,"pr":1.295,"cardList":[["BT1-022","가루다몬"],["BT1-026","브레이크드라몬"],["BT1-081","헤라클레스캅테리몬"],["BT1-083","그랜쿠가몬"],["BT11-057","타이타몬"],["BT15-050","쥬레이몬"],["BT15-052","피노키몬"],["BT15-078","데블시드라몬"],["BT18-043","팅커몬"],["BT18-049","슈츠몬"],["BT20-038","팔코몬"],["BT20-039","디아트리몬"],["BT21-048","머슈몬"],["BT21-049","우드몬"],["BT22-045","웨즌감마몬"],["BT22-049","베지몬"],["BT3-015","메탈그레이몬"],["BT3-016","듀란다몬"],["BT3-018","블리츠그레이몬"],["BT3-055","다이노몬"],["BT3-058","반쵸스팅몬"],["BT3-092","베리얼묘티스몬"],["BT3-111","황제드라몬: 드래곤 모드"],["BT4-090","카오스몬"],["BT6-050","페탈드라몬"],["BT7-089","안도영"],["EX1-038","스팅몬"],["EX10-015","사이케몬"],["EX10-018","아스타몬"],["EX5-060","드라고몬"],["EX7-011","메가드라몬"],["EX7-033","모노크로몬"],["EX9-034","쿠네몬"],["EX9-038","쿠가몬"],["EX9-043","메탈티라노몬"],["P-143","두리몬" ":1.991,"cardList":[["BT16-059","슛몬"],["BT16-062","잔메츠몬"],["BT19-063","다크나이트몬"],["BT20-055","인비지몬"],["BT23-060","파워드라몬"],["BT9-112","데크스몬"],["EX3-053","메탈릭드라몬"],["EX4-073","오메가몬 Alter-B"],["EX9-043","메탈티라노몬"],["LM-043","다크드라몬 ACE"],["P-174","볼트몬"]],"qaList":[["EX3-053","상대의 이 카드의 【등장 시】효과가 발휘한 다음 턴에 액티브 상태의 디지몬과 레스트 상태의 디지몬으로 조그레스 진화는 할 수 있습니까?","아니요, 할 수 없습니다. 조그레스 진화할 디지몬이 2마리 모두 레스트 상태여야 하며, 그렇지 않으면 이 카드의 효과에 의해 진화는 할 수 없습니다."],["EX3-053","상대의 이 카드의 【등장 시】효과가 발휘한 다음 턴에 ≪흡수진화≫의 효과로 액티브 상태의 디지몬을 레스트하여 그 디지몬을 진화할 수 있습니까?","아니요, 할 수 없습니다. ≪흡수진화≫는 「진화할 때」의 효과이기 때문에 진화원이 되는 디지몬이 진화할 수 있는 상태가 아니라면 효과의 발휘를 할 수 없습니다."],["EX3-053","상대의 이 카드의 【등장 시】효과가 발휘한 다음 턴에 액티브상태의 테이머에서 「BT4-011　아그니몬」으로 진화하는 것은 할 수 있습니까?","아니요, 할 수 없습니다. 「BT4-011　아그니몬」은 「레드인 자신의 테이머를 레드인 Lv.3의 디지몬으로서 취급하여 진화할 수 있다」 효과이기 때문에 액티브 상태의 디지몬으로 간주하여 진화할 수 없습니다."],["EX4-073","이 카드의 【진화 시】 효과의 「그 후」 이후의 처리는 상대의 디지몬을 1마리도 선택하지 않고 소멸시키지 않을 수 있나요?","아니요, 할 수 없습니다. 상대의 디지몬을 최소 1마리는 소멸시켜야 합니다."],["BT16-059","이 카드의 【등장 시】【진화 시】효과는 자신의 시큐리티가 3장일 때, 「상대의 디지몬 1마리를 ≪퇴화1≫」과 「등장 코스트 6 이하인 상대의 디지몬 1마리를 소멸시킨다」 양쪽 효과를 발휘할 수 있습니까?","네, 그렇습니다."],["BT16-062","이 카드로 진화했을 때, 진화원의 명칭에 「감마몬」을 포함한 카드가 가진 【진화 시】효과는 발휘합니까?","네, 발휘합니다. 이 카드의 「이 디지몬은, 이 디지몬의 진화원에 있는 명칭에 「감마몬」을 포함한 카드 효과 전부를 얻는다.」 효과는 【서로의 턴】이기 때문에 진화가 확정된 순간에 발휘합니다. 그러므로 【진화 시】효"]],"rules":[["16-12","《퇴화》"],["4-15","소멸"],["15-16-3","【진화 시】"],["15-16-2","【등장 시】"],["15-6","처리 조건"]]},{"id":"P326","p":326,"size":4,"cards":4,"qa":2,"label":"【상대의 턴 종료 시】[턴 1회]가장 등장 코스트가 낮은 상대의 디지몬 1마리를 소멸시킨다.","types":"소멸","sub":"【상대의 턴 종료 시】","comm":1,"pr":0.971,"cardList":[["BT15-018","캐논드라몬"],["BT16-010","헬루가몬"],["BT23-075","이터 EDEN"],["BT9-112","데크스몬"]],"qaList":[["BT15-018","이 카드의 「메모리가 4 이하라면」은 구체적으로 어떤 것입니까?","이 효과가 발휘한 시점에 메모리가 「자신 쪽의 1~4」「0」「상대 쪽의 1~10」 어느 한 가지라면 조건을 만족하고 있는 것입니다."],["BT16-010","이 카드의 【상대의 턴 종료 시】효과는 상대의 디지몬이 1마리도 없을 때도, 이 디지몬을 소멸시킬 수 있습니까?","네, 가능합니다."]],"rules":[["15-16-12","【자신의 턴 종료 시】【상대의 턴 종료 시】【서로의 턴 종료 시】"],["4-15","소멸"],["15-14-1","[턴 X회]"],["15-6","처리 조건"]]} ,["P-096","프리즘 가렛"],["ST12-16","지진! 천둥! 화재! 아버지!"],["ST13-15","﻿다이렉트 스매셔"]],"qaList":[["BT6-095","「특징으로 「3총사」를 갖는 자신의 디지몬이 있을 때, 이 옵션 카드는 색 조건을 무시하고 사용할 수 있다.」 란, 구체적으로 무슨 뜻인가요?","특징으로 「3총사」를 갖는 자신의 디지몬이 배틀 에어리어에 있는 상태라면, 레드인 자신의 디지몬 또는 테이머가 없더라도, 이 옵션 카드를 사용할 수 있다는 뜻입니다."],["BT6-105","「특징으로 「3총사」를 갖는 자신의 디지몬이 있을 때, 이 옵션 카드는 색 조건을 무시하고 사용할 수 있다.」 는, 구체적으로 어떤 효과인가요?","특징으로 「3총사」를 갖는 자신의 디지몬이 배틀 에어리어에 있는 상태라면, 블랙인 자신의 디지몬이나 테이머가 없더라도 이 옵션 카드를 사용할 수 있다는 뜻입니다."],["BT6-109","「특징으로 「3총사」를 갖는 자신의 디지몬이 있을 때, 이 옵션 카드는 색 조건을 무시하고 사용할 수 있다.」 란, 구체적으로 어떤 의미인가요?","특징으로 「3총사」 를 갖는 자신의 디지몬이 배틀 에어리어에 있는 상태라면, 퍼플인 자신의 디지몬 또는 테이머가 없더라도, 이 옵션 카드를 사용할 수 있다는 뜻입니다."],["BT7-110","「특징으로 「하이브리드체」를 갖는 자신의 디지몬이 있을 때, 이 옵션 카드는 색 조건을 무시하고 사용할 수 있다.」는 것은 구체적으로 어떤 것입니까?","특징으로 「하이브리드체」를 갖는 자신의 디지몬이 배틀 에어리어에 있는 상태라면 화이트의 자신의 디지몬이나 테이머가 없더라도 이 옵션 카드를 사용할 수 있다는 것입니다."],["BT8-110","이 카드를 사용하여 패에서 특징으로 「아머체」를 갖는 자신의 디지몬 1마리로 진화할 때, 진화조건을 무시하여 진화할 수 있습니까?","아니요. 이 카드의 효과로는 진화조건을 무시할 수 없습니다."]],"rules":[["4-22","색 조건"],["9-1","사용"],["15-9-2","임의 처리"]]},{"id":"P327","p":327,"size":4,"cards":4,"qa":0,"label":"【시큐리티】메모리+1 하고, 이 카드를 패에 추가한다.","types":"메모리 증가 / 패로 회수","sub":"【시큐리티】","comm":1,"pr":1.192,"cardList":[["BT10-109","강화 플러그인 O"],["BT20-099","혼돈의 특이점"],["BT9-109","X항체"],["ST12-14","아우스 제네릭스"]],"qaList":[],"rules":[["15-16-10","【시큐리티】"],["3-5","패"],["3-1-3","영역의 룰"],["4-1","메모리"],["13-1","시큐리티 체크"]]},{"id":"P328","p":328,"size":4,"cards":4,"qa":2,"label":"【메인】이 디지몬을 진화원에 「ADR-01=쥬리」가 없는 자신의 「마더 디・리퍼」의 진화원 아래에 놓는다.","types":"진화원에 놓기","sub":"【메인】","comm":1,"pr":1.528,"cardList":[["BT19-078","ADR-01=쥬리"],["BT22-095","스에도 아케미"],["BT9-109","X항체"],["P-146","충전 플러그인 Q"]],"qaList":[["BT9-109","이 카드를 진화원의 가장 아래에 가진 디지몬을 대상으로 「상대의 디지몬의 진화원을 아래에서 2장 파기한다」효과가 발휘되면 어떻게 됩니까?","이 카드는 효과로 파기되지 않기 때문에 이 카드의 1장 위의 진화원인 카드만이 파기됩니다."],["BT9-109","자신의 「EX2-007 마더 디・리퍼」의 진화원에 8장의 카드가 있고 가장 아래에 이 카드가 있습니다. 자신이 「EX2-055 리퍼」를 등장시킬 때에 「자신의 「EX2-007 마더 디・리퍼」 1마리의 진화원을 아래에서 7장 이상 파기하는 것으로 지불하","그 경우, 진화원을 아래에서 8장 파기하는 것을 선언하여 「BT9-109 X항체」를 제외하고 7장을 파기하면 발휘하는 것이 가능합니다."]],"rules":[["15-16-7","【메인】"],["4-8","진화원"],["4-7","겹쳐져 있는 카드"]]},{"id":"P83","p":83,"size":16,"cards":15,"qa":18,"label":"【어택 시】이 디지몬을 패의 「히샤류우몬」 또는 특징으로 「크로니클」을 가진 디지몬 카드로 진화시킬 수 있다.","types":"진화","sub":"【어택 시】","comm":9,"pr":1.777,"cardList":[["BT16-071","매드레오몬"],["BT18-076","레베몬"],["BT20-012","긴류우몬"],["BT22-070","다크티라노몬 X항체"],["BT23-062","드라큐몬"],["BT23-063","상굴몬"],["BT7-051","라이노캅테리몬"],["BT9-071","드라큐몬"],["BT9-073","상굴몬"],["BT9-109","X항체"],["EX1-035","캅테리몬"],["EX1-040","아트라캅테리몬"],["EX1-040P","아트라캅테리몬"],["EX7-006","야몬"],["P-176","도리몬"]],"qaList":[["BT9-109","이 카드의 진화원 효과는 진화조건에 맞지 않는 디지몬에서 패의 특징으로 「X항체」를 가진 디지몬 카드로 진화할 수 있습니까?","아니요. 이 카드의 효과로는 진화조건을 무시할 수 없기 때문에 할 수 없습니다."],["EX1-035","이 카드의 【어택 시】효과로 진화했을 때, 그 디지몬이 【어택 시】효과를 갖고 있다면, 그 효과는 발휘합니까?","아니요, 이미 【어택 시】효과가 유발하는 타이밍이 지나 있어, 발휘하지 않습니다."],["EX1-035","이 카드의 【어택 시】효과로 진화했을 때, 진화 코스트를 지불하는 것으로 메모리가 상대 쪽으로 1 이상이 되었습니다. 그 어택은 어떻게 됩니까?","어택은 그대로 계속합니다. 어택 종료까지, 턴은 교체되지 않습니다."],["EX1-040","이 카드의 【어택 시】효과로 진화했을 때, 진화 코스트를 지불하는 것으로, 메모리가 상대의 1 이상이 되었습니다. 어택은 어떻게 됩니까?","어택은 계속합니다. 아직 턴은 교체되지 않습니다. 어택이 종료되고, 그로 인해 유발한 효과가 전부 발휘한 후에 메모리가 아직도 상대의 1 이상이 되어 있다면, 턴을 교체합니다."],["EX1-040","자신의 「EX1-035 캅테리몬」으로 어택하여, 【어택 시】효과로 이 카드에 진화했습니다. 연이어 이 카드의 【어택 시】효과로, 더 진화할 수 있습니까?","아니요, 이미 【어택 시】효과가 유발하는 타이밍은 지났기 때문에, 할 수 없습니다."],["EX1-040","이 카드의 【어택 시】효과는, 어택했을 때 패에 특징에 「곤충형」이나 「고대곤충형」을 갖고 있는 디지몬 카드가 있을 경우, 반드시 진화해야 합니까?","아니요, 「진화할 수 있다」이므로, 반드시 진화하지 않아도 됩니다."]],"rules":[["15-16-5","【어택 시】"],["8-1","진화"],["15-9-2","임의 처리"],["15-3","진화원 효과"],["15-14-1","[턴 X회]"]]},{"id":"P329","p":329,"size":4,"cards":4,"qa":0,"label":"【어택 시】[턴 1회]가장 Lv.이 낮은 상대의 디지몬 1마리를 소멸시킨다.","types":"소멸","sub":"【어택 시】","comm":4,"pr":1.422,"cardList":[["BT16-026","바이킹몬 ACE"],["BT22-078","볼트몬"],["BT8-026","호루스몬"],["ST16-12","메탈가루몬 ACE"]],"qaList":[],"rules":[["15-16-5","【어택 시】"],["4-15","소멸"],["15-14-1","[턴 X회]"]]},{"id":"P415","p":415,"size":3,"cards":3,"qa":3,"label":"【어택 시】상대의 트래시에서 카드 7장을 덱 아래로 되돌리는 것으로, 이 디지몬을 액티브로 한다.","types":"덱으로 되돌림 / 액티브","sub":"【어택 시】","comm":5,"pr":1.389,"cardList":[["BT13-033","미라쥬가오가몬: 버스트 모드"],["BT17-070","가르프몬"],["BT17-077","황제드라몬: 팔라딘 모드 ACE"]],"qaList":[["BT13-033","이 카드의 【어택 시】효과로 상대의 패에서 덱으로 되돌리는 카드를 선택하는 것은 어느 쪽의 플레이어인가요?","이 카드의 효과를 발휘한 플레이어입니다. 상대의 패가 8장이 되도록 상대의 패를 지정하고, 되돌리는 순서도 지정하여 덱 아래로 되돌리게 합니다."],["BT13-033","상대의 이 카드의 【어택 시】효과로 자신의 패를 덱 아래로 되돌릴 때에, 되돌리는 카드의 내용을 자신은 확인할 수 있나요?","네, 가능합니다. 효과를 발휘한 상대 쪽은 보지 않고 카드를 선택하기 때문에 어떠한 카드를 덱 아래로 되돌렸는지 확인할 수 없지만, 되돌려진 카드의 주인인 플레이어는 덱 아래로 되돌려지기 직전까지는 패의 내용을 확인"],["BT17-070","이 카드의 【어택 시】효과로 상대의 트래시의 디지타마 카드를 대상으로 선택할 수 있습니까?","네, 가능합니다. 단, 디지타마 카드가 덱 아래에 놓는 효과의 대상이 된 경우, 디지타마 덱 아래에 놓입니다."]],"rules":[["15-16-5","【어택 시】"],["4-13","표시 형식"],["3-2","덱"],["3-1-3","영역의 룰"],["15-6","처리 조건"]]},{"id":"P416","p":416,"size":3,"cards":3,"qa":0,"label":"〔진화〕명칭에 「메탈그레이몬」을 포함하는 Lv.5 : 코스트 3《돌진》(이 디지몬이 어택했을 때, 어택의 대상을 가장 DP가 높은 액티브 상태인","types":"특수 진화 조건:진화","sub":"","comm":0,"pr":0.604,"cardList":[["BT12-068","메탈그레이몬"],["BT12-070","워그레이몬"],["RB1-008","베텔감마몬"]],"qaList":[],"rules":[["8-1","진화"],["2-3-5","진화 조건"],["16-23","《돌진》"],["11","어택"],["15-9-2","임의 처리"]]},{"id":"P266","p":266,"size":5,"cards":5,"qa":1,"label":"【서로의 턴】[턴에 1회]어택의 대상이 변경되었을 때, 이 디지몬을 액티브로 한다.","types":"액티브","sub":"【서로의 턴】","comm":14,"pr":2.139,"cardList":[["BT12-070","워그레이몬"],["BT18-070","라이노캅테리몬"],["BT21-035","화염드라몬"],["EX9-054","레어레어몬"],["P-144","울퉁몬 X항체"]],"qaList":[["BT12-070","이 카드의 【서로의 턴】효과는 이 디지몬 이외의 자신의 디지몬이나 상대의 디지몬의 어택으로 어택의 대상이 변경되었을 때도 발휘합니까?","네, 발휘합니다."]],"rules":[["4-13","표시 형식"],["15-5","유발 조건"],["15-8-3","유발형 효과"],["15-14-1","[턴 X회]"],["15-16-9","【서로의 턴】"]]},{"id":"P136","p":136,"size":9,"cards":9,"qa":2,"label":"《돌진》(이 디지몬이 어택했을 때, 어택의 대상을 가장 DP가 높은 액티브 상태인 상대의 디지몬 1마리로 변경할 수 있다)","types":"키워드 · 《돌진》","sub":"","comm":0,"pr":0.583,"cardList":[["BT11-010","그리즈몬"],["BT11-014","아이언레오몬"],["BT11-017","마르스몬"],["BT12-018","듀크몬"],["BT14-016","트리케라몬"],["EX10-042","그루스감마몬"],["EX9-008","피요몬"],["EX9-010","태스크몬"],["P-091","블랙버드라몬"]],"q ,"이 카드의 효과는 레스트 상태의 상대의 디지몬이나 테이머를 대상으로 골라 「다음 상대의 턴 종료 시까지 이 효과로 레스트한 상대의 카드는 액티브가 되지 않는다」의 효과를 적용하는 것은 가능합니까?","아니요. 이미 레스트되어 있는 상대의 디지몬이나 테이머를 대상으로 하는 것은 가능합니다만 이 카드는 「이 효과로 레스트한 상대의 카드」가 아니면 「다음 상대의 턴 종료 시까지 이 효과로 레스트한 상대의 카드는 액티브"]],"rules":[["4-13","표시 형식"],["15-16-3","【진화 시】"],["15-16-2","【등장 시】"],["15-6","처리 조건"],["15-16-7","【메인】"]]},{"id":"P73","p":73,"size":18,"cards":18,"qa":7,"label":"【자신의 턴】 이 디지몬은 어택할 수 없다.","types":"어택 금지","sub":"【자신의 턴】","comm":0,"pr":1.063,"cardList":[["BT11-037","코테몬"],["BT15-061","가드로몬"],["BT15-074","연체몬"],["BT16-057","메카노몬"],["BT2-058","가드로몬"],["BT23-051","록몬"],["BT5-062","메카노몬"],["BT5-065","셰이드몬"],["BT8-029","프로조몬"],["EX1-047","가드로몬"],["EX1-056","피코데블몬"],["EX2-035","사이버드라몬"],["EX2-036","그랜드로코몬"],["EX2-045","동글몬"],["EX2-046","ADR-02=서쳐"],["P-144","울퉁몬 X항체"],["ST14-04","파스코몬"],["ST7-04","피요몬"]],"qaList":[["P-144","특징으로 「X항체」를 가진 디지몬 카드가 이 디지몬의 진화원에 있는 경우, 이 디지몬은 어택할 수 있습니까?","아니요, 할 수 없습니다."],["EX1-056","이 디지몬은, 명칭에 「묘티스몬」을 포함한 자신의 디지몬이 없을 때, 플레이어에게 어택할 수 있습니까?","네, 플레이어에게 어택할 수 있습니다."],["EX1-056","이 디지몬이, 명칭에 「묘티스몬」을 포함한 자신의 디지몬이 없을 때에 플레이어에게 어택하여, 상대의 디지몬에 블록되었을 경우, 어떻게 됩니까?","블록되었을 경우에 통상적으로 배틀을 실행합니다."],["BT8-029","진화원을 갖는 상대의 디지몬이 육성 에어리어에 있을 때, 이 디지몬은 어택할 수 없습니까?","아니요. 육성 에어리어의 디지몬은 효과로 참조하지 않기 때문에 어택할 수 있습니다."],["EX2-035","이 카드가 어떤 효과로 ≪관통≫을 갖고 있을 때, 자신의 테이머가 없는 상태로 상대의 디지몬에게 어택하여 배틀로 상대의 디지몬만을 소멸시켰습니다. 이 경우는 ≪관통≫의 효과로 상대의 시큐리티를 체크할 수 있습니까?","네. 자신의 테이머가 없는 상태에서도 ≪관통≫은 평소대로 발휘됩니다."],["EX2-036","이 카드가 플레이어에 어택하고 상대의 디지몬에게 블록되었을 경우, 어떻게 됩니까?","상대의 디지몬에게 블록되었을 경우에는 평소대로 디지몬끼리의 배틀이 진행됩니다."]],"rules":[["15-16-8","【자신의 턴】【상대의 턴】"],["11","어택"]]},{"id":"P336","p":336,"size":4,"cards":4,"qa":0,"label":"【서로의 턴】《블로커》를 가진 자신의 디지몬 전부를 DP +1000.","types":"DP 증가","sub":"【서로의 턴】","comm":5,"pr":1.053,"cardList":[["BT6-057","토이아구몬"],["BT9-005","고로몬"],["EX2-034","안드로몬"],["P-144","울퉁몬 X항체"]],"qaList":[],"rules":[["16-5","《블로커》"],["2-5","DP（디지몬 파워）"],["15-15-4","효과의 수치를 플러스・마이너스하는 효과"],["15-3","진화원 효과"],["15-16-9","【서로의 턴】"]]},{"id":"P50","p": 코스트를 지불하지 않고 등장시키는 효과는 등장 코스트를 마이너스하는 효과가 아닙니다."],["BT8-071","「서로는 지불하는 등장 코스트를 마이너스할 수 없다.」 효과가 발휘되고 있는 동안, 육성 에어리어의 디지몬의 효과로 등장 코스트를 마이너스할 수 있나요?","아니요, 등장 코스트를 마이너스할 수 없습니다. 「서로는 지불하는 등장 코스트를 마이너스할 수 없다.」 효과는 등장 코스트를 마이너스하는 효과를 발휘하고 있는 카드에 영향을 미치는 것이 아니라 서로의 플레이어에게 영"],["BT8-071","「서로는 지불하는 등장 코스트를 마이너스할 수 없다.」 효과가 발휘되고 있는 동안, 디지크로스할 수 있나요?","네, 디지크로스할 수 있습니다. 단, 디지크로스로 등장 코스트를 마이너스할 수 없습니다. 그로 인해 코스트를 지불할 수 없는 상황에서는 그 카드의 등장을 선언할 수 없습니다."],["BT8-059","「서로는 진화조건을 무시할 수 없다」란 어떤 효과인가요?","진화 조건을 무시하고 진화할 수 없게 되는 효과입니다. 이 효과는 서로의 플레이어에게 영향을 미칩니다."],["BT8-059","「서로는 진화조건을 무시할 수 없다」 효과가 발휘되어 있는 동안, 조그레스 진화나 버스트 진화를 시킬 수 있나요?","네, 조그레스 진화나 버스트 진화를 시킬 수 있습니다."]],"rules":[["15-16-9","【서로의 턴】"]]},{"id":"P165","p":165,"size":8,"cards":8,"qa":15,"label":"【서로의 턴】메모리가 0 이하인 동안, 이 디지몬의 DP 소멸 효과의 상한 +2000.","types":"상한·수치 변경","sub":"【서로의 턴】","comm":8,"pr":1.31,"cardList":[["BT12-001","기기몬"],["BT17-008","길몬"],["BT17-010","그라우몬"],["BT19-007","길몬"],["BT19-009","그라우몬"],["BT19-011","메가로그라우몬 ACE"],["EX2-010","메가로그라우몬"],["LM-026","메기드라몬 ACE"]],"qaList":[["EX2-010","「DP 소멸 효과의 상한+X000」이란 어떤 효과인가요?","DP 소멸 효과에 기술된 수치의 상한을 플러스하는 효과입니다. 예를 들어 「【자신의 턴】자신이 발휘하는 DP 소멸 효과의 상한+1000.」이 발휘되고 있는 동안, 「【진화 시】DP 3000 이하의 상대의 디지몬 1마"],["EX2-010","「DP 소멸 효과의 상한+X000」 효과가 발휘되고 있는 동안, 「이 디지몬의 DP 이하의 상대의 디지몬을 소멸시킨다.」 등 디지몬의 DP를 참조하여 소멸시키는 효과의 상한을 플러스할 수 있나요?","아니요, 플러스할 수 없습니다. 수치가 기술되어 있지 않은 DP 소멸 효과의 상한을 플러스할 수 없습니다."],["EX2-010","이 카드의 진화원 효과는 이 카드를 진화원에 가진 디지몬의 효과 이외의 자신이 발휘한 DP 소멸 효과도 상한 +1000합니까?","네. 그렇습니다."],["BT12-001","「DP 소멸 효과의 상한 +X000」이란, 어떤 효과입니까?","DP 소멸 효과에 기술된 수치의 상한을 플러스하는 효과입니다. 예를 들어 「【자신의 턴】자신이 발휘하는 DP 소멸 효과의 상한 +1000.」이 발휘되어 있는 동안 「【진화 시】DP 3000 이하의 상대의 디지몬 1마"],["BT12-001","「DP 소멸 효과의 상한 +X000」효과가 발휘되어 있는 동안 「이 디지몬의 DP 이하인 상대의 디지몬을 소멸시킨다.」 같은 디지몬의 DP를 참조하여 소멸시키는 효과의 상한을 플러스하는 것은 가능합니까?","아니요, 플러스 할 수 없습니다. 수치가 기술되어 있지 않은 DP 소멸 효과의 상한을 플러스하는 것은 할 수 없습니다."],["BT17-008","DP 3000 이하인 상대의 디지몬이 있을 때, 이 카드의 효과를 발휘하여 굳이 상대의 디지몬을 소멸시키지 않는 것으로 메모리+1할 수 있습니까?","아니요, 적절한 대상이 있다면 반드시 그 대상으로 효과를 발휘시켜야 합니다. 적절한 대상이 있는 상태로 효과를 발휘하지 않을 수는 없습니다."]],"rules":[["15-3","진화원 효과"],["15-15-4","효과의 수치를 플러스・마이너스하는 효과"],["15-16-9","【서로의 턴】"],["15-16-8","【자신의 턴】【상대의 턴】"]]},{"id":"P23","p":23,"size":50,"cards":49,"qa":2,"label":"《길동무》 (배틀에서 이 디지몬만이 소멸했을 때, 배틀한 상대의 디지몬을 소멸시킨다)","types":"키워드 · 《길동무》","sub":"","comm":0,"pr":2.127,"cardList":[["BT10-083","미네르바몬"],["BT11-078","소울몬"],["BT11-079","다크리자몬"],["BT11-084","블루메라몬"],["BT12-076","도베르몬"],["BT15-070","피코데블몬"],["BT15-073","고스몬"],["BT15-077","레이디데블몬"],["BT15-079","피에몬"],["BT17-061","고부리몬"],["BT17-063","다르크몬"],["BT18-007","가지몬"],["BT18-013","델타몬"],["BT18-075","레오르몬"],["BT18-077","카이저레오몬"],["BT18-079","베르그몬"],["BT18-080","오보로몬"],["BT19-067","임프몬"],["BT2-074","데블몬"],["BT2-080","피에몬"],["BT20-062","캔들몬"],["BT20-065","추추몬"],["BT20-066","스팅몬"],["BT21-069","그루스감마몬"],["BT3-080","블랙버드라몬"],["BT5-080","황금무사몬"],["BT6-078","스컬그레이몬"],["BT8-075","코가몬"],["BT8-076","팡그몬"],["BT8-077","블랙가트몬"],["EX1-056","피코데블몬"],["EX1-057","위자몬"],["EX1-063","베놈묘티스몬"],["EX1-063P","베놈묘티스몬"],["EX10-027","데들리액스몬"],["EX2-040","데블드라몬"],["EX7-051","스패로우몬"],["EX7-053","아이즈몬: 스캐터모드"],["EX7-056","오로치몬"],["EX8-038","아구몬"]],"qaList":[["BT18-077","디지몬은 진화원에 있는 테이머 카드의 하단 텍스트의 진화원 효과를 얻나요?","네, 얻습니다."],["BT18-079","디지몬은 진화원에 있는 테이머 카드의 하단 텍스트의 진화원 효과를 얻나요?","네, 얻습니다."]],"rules":[["16","키워드 효과"],["16-13","《길동무》"],["4-15","소멸"],["15-5","유발 조건"],["15-8-3","유발형 효과"]]},{"id":"P145","p":145,"size":9,"cards":9,"qa":5,"label":"【진화 시】자신의 덱 위에서부터 2장 파기한다. 그 후, 자신의 트래시에서 특징으로 「마왕형」을 가진 카드 1장을 패로 되돌린다.","types":"파기 / 패로 회수","sub":"【진화 시】","comm":6,"pr":1.833,"cardList":[["BT11-083","레이디데블몬"],["BT11-087","리리스몬"],["BT6-068","임프몬"],["BT8-079","스컬사탄몬"],["EX2-041","도베르몬"],["EX4-008","블랙그라우몬"],["EX7-053","아이즈몬: 스캐터모드"],["ST10-13","유노몬"],["ST10-15","암흑파"]],"qaList":[["BT6-068","이 카드의 효과는, 등장하면 반드시 자신의 패를 1장 파기해야 하나요?","아니요, 「파기할 수 있다」 이기에, 파기하는 것은 임의입니다. 파기하지 않았을 경우, 「자신의 트래시에서 특징에 「7대마왕」 또는 「3총사」를 갖는 디지몬 카드 1장을 패로 되돌린다」는 행할 수 없습니다."],["BT11-083","이 카드의 【진화 시】 효과는, 자신의 패에서 「미카구라 미레이」 또는 특징으로 「천사형」/「대천사형」/「타천사형」을 가진 카드를 파기한 경우, 파기한 카드를 그대로 트래시에서 패로 되돌릴 수 있습니까?","네, 가능합니다."],["BT11-087","이 카드의 【등장 시】 효과는, 트래시 중 특징으로 「바그라군」을 포함한 카드를 패에 추가하지 않고, 자신의 테이머 1명의 진화원에 두는 것은 가능합니까?","아니요, 할 수 없습니다. 우선 트래시 중 특징 「바그라군」을 포함한 카드 1~2장을 패에 추가한 다음, 특징으로 「바그라군」을 가진 카드 1~2장을 테이머 아래에 놓아 주십시오. 대상 카드를 패에 추가하지 않고 테"],["EX4-008","이 카드의 【진화 시】효과는 반드시 서로의 덱을 위에서부터 2장 파기하는 것일까요?","네, 가능하다면 서로의 덱을 위에서부터 각각 2장씩 파기해야 합니다."],["EX4-008","이 카드의 【진화 시】효과는 자신의 트래시에 「길몬」 또는 명칭에 「그라우몬」/「듀크몬」을 포함하는 카드가 있을 때에, 임의로 그 카드를 패로 되돌리지 않는 것은 가능한가요?","네, 「패로 되돌릴 수 있다」효과이므로 패로 되돌리지 않는 것이 가능합니다. 단, 그 경우에도 서로의 덱을 위에서부터 2장 파기하는 것은 반드시 진행됩니다."]],"rules":[["3-5","패"],["3-1-3","영역의 룰"],["4-16","파기"],["15-16-3","【진화 시】"],["15-9-2","임의 처리"]]},{"id":"P338","p":338,"size":4,"cards":4,"qa":7,"label":"【어택 시】 상대의 디지몬에게 어택했을 때, 이 턴 동안, 이 디지몬의 DP를 +1000 한다.","types":"DP 증가 / 유발 · 상대의 디지몬 · 어택함","sub":"【어택 시】","comm":4,"pr":2.286,"cardList":[["BT1-001","어니몬"],["BT3-004","데롱몬"],["ST4-04","팔몬"],["ST4-06","니드몬"]],"qaList":[["BT3-004","이 카드를 진화원으로 둔 디지몬이 상대 플레이어에게 어택하여 상대 디지몬에게 블록되었습니다. 이 경우 이 카드의 효과는 발휘됩니까?","아니요, 상대 플레이어에 대해 어택을 선언했다면 블록되어 디지몬과의 배틀이 되었다고 해도 효과는 발휘되지 않습니다."],["ST4-04","이 카드를 진화원으로 갖는 디지몬이 상대 플레이어에게 어택하여, 상대 디지몬에게 블록당하였습니다. 이 경우, 이 카드의 효과는 발휘하나요?","아니요, 상대 플레이어에 대해 어택을 선언한 상태였다면, 블록당해 상대의 디지몬과 배틀하게 되었다고 해도 효과는 발휘하지 않습니다."],["ST4-04","이 카드를 진화원으로 갖는 디지몬이 상대 디지몬에게 어택하여, 어택 시 효과로 대상인 상대 디지몬을 소멸시켰습니다. 이 경우, 이 카드의 효과는 발휘하나요?","네, 상대 디지몬에게 어택을 선언한 상태였기 때문에, 그 시점에서 이 효과는 발휘합니다."],["BT1-001","이 카드의 진화원 효과는 시큐리티 디지몬과의 배틀에서도 발휘하나요?","아니요, 발휘하지 않습니다."],["BT1-001","이 카드를 진화원으로 가진 디지몬이 상대 플레이어에게 어택했을 때, 상대의 디지몬에게 블록되었습니다. 이 경우, 이 카드의 효과는 발휘하나요?","아니요, 상대 플레이어에 대한 어택을 선언한 것이라면 블록된 디지몬과 배틀이 되었다고 하더라도 효과는 발휘하지 않습니다."],["ST4-06","이 카드를 진화원으로 갖는 디지몬이 상대 플레이어에게 어택하여, 상대 디지몬에게 블록당했습니다. 이 경우, 이 카드의 효과는 발휘하나요?","아니요, 상대 플레이어에 대해 어택을 선언했었다면, 블록당해 상대의 디지몬과 배틀하게 되었다고 해도 효과는 발휘하지 않습니다."]],"rules":[["15-3","진화원 효과"],["15-16-5","【어택 시】"],["2-5","DP（디지몬 파워）"],["15-15-4","효과의 수치를 플러스・마이너스하는 효과"],["15-5","유발 조건"]]},{"id":"P65","p":65, 플롯트몬」의 효과 조건을 충족하지 못하게 되므로, 2번째 효과는 발"],["BT1-107","자신의 시큐리티가 1장일 때, 《시큐리티 어택+1》을 가진 상대 디지몬이 플레이어에게 어택하여 이 카드가 체크되었습니다. 시큐리티 효과에 의해 〈리커버리 +1 《덱》〉이 발휘되어 0장이었던 시큐리티가 1장이 되었는데, 이때 계속 체크를 합니까?","네, 계속해서 〈리커버리 +1 《덱》〉로 늘어난 시큐리티를 체크합니다."],["BT7-082","이 카드의 【등장 시】 효과로 자신의 패 또는 트래시에서 「시스터몬 블랑(각성)」을 진화원에 놓을 수 있습니까?","아니요. 할 수 없습니다. 이 효과의 대상이 되는 것은 카드명이 「시스터몬 블랑」인 카드뿐입니다."],["BT8-024","자신의 시큐리티 전부를 오픈 및 확인 중에 이 카드가 진화할 때, 이 카드의 【자신의 턴】 효과로 《리커버리 +1》을 할 수 있나요?","아니요, 할 수 없습니다. 1개의 영역 전부를 오픈 및 확인 중에는 그 영역의 카드를 늘릴 수 없습니다."],["EX2-018","이 카드의 효과로는 시큐리티가 5장이 될 때까지만 ≪리커버리 +1《덱》≫으로 늘어납니까?","네. 이 효과는 「이 효과로 시큐리티는 6장 이상이 되지 않는다」이므로 5장이 될 때까지만 늘어납니다."]],"rules":[["16-6","《리커버리》"],["3-7","시큐리티"],["15-16-2","【등장 시】"],["15-16-3","【진화 시】"],["15-16-10","【시큐리티】"]]},{"id":"P428","p":428,"size":3,"cards":3,"qa":3,"label":"【어택 시】 플레이어에게 어택했을 때, 이 턴 동안 이 디지몬의 DP를 +2000 한다.","types":"DP 증가 / 유발 · 어택함","sub":"【어택 시】","comm":4,"pr":1.916,"cardList":[["BT2-012","버드라몬"],["BT6-001","푸치메라몬"],["ST7-02","아구몬"]],"qaList":[["ST7-02","이 디지몬이 상대 플레이어에게 어택하였으나 상대의 디지몬에게 블록되었습니다. 이 경우, 이 디지몬의 효과는 발휘합니까?","네. 블록되었더라도 상대 플레이어에게 어택을 선언하고 있다면, 효과가 발휘됩니다."],["BT2-012","이 디지몬이 상대 플레이어에게 어택하여 상대 디지몬에게 블록되었습니다. 이 경우, 이 디지몬의 효과는 발휘됩니까?","네, 블록되었더라도 상대 플레이어에 대해 어택을 선언했다면 효과는 발휘합니다."],["BT6-001","이 카드를 진화원으로 가진 디지몬이 플레이어에게 어택하고, 상대 디지몬에게 블록 되었습니다. 이 경우 이 디지몬의 효과는 발휘하나요?","네, 블록당하더라도 플레이어를 대상으로 어택을 선언하였다면, 효과는 발휘합니다."]],"rules":[["15-16-5","【어택 시】"],["2-5","DP（디지몬 파워）"],["15-15-4","효과의 수치를 플러스・마이너스하는 효과"],["15-5","유발 조건"],["15-8-3","유발형 효과"]]},{"id":"P429","p":429,"size":3,"cards":3,"qa":1,"label":"【어택 시】［턴에 1회］진화원을 갖지 않은 상대의 디지몬이 있을 때, 《1 드로우》 (자신의 덱에서 카드를 1장 드로우한다).","types":"드로우","sub":"【어택 시】","comm":4,"pr":2.298,"cardList":[["BT1-003","우파몬"],["BT3-002","꼬마몬"],["BT3-003","우파몬"]],"qaList":[["BT1-003","이 카드의 진화원 효과는, 육성 에어리어에 진화원을 가지지 않은 상대 디지몬이 있는 경우에도 발휘하나요?","아니요, 육성 에어리어에 있는 디지몬은 참조되지 않습니다."]],"rules":[["15-3","진화원 효과"],["15-16-5","【어택 시】"],["4-14","드로우"],["16-9","《재밍》"]]},{"id":"P122","p":122,"size":11,"cards":11," 대상으로 선택한 경우, 룰에 의해 보내지는 곳이 패에서 변경되어 게임에서 제거되지만, 이 카드의 「자신의 디지몬 1마리를 패로 되돌리는 것으로」는 행한 것으로 "],["BT7-029","이 카드 효과의 【진화 시】【어택 시】라는 2개의 타이밍은 어떤 의미입니까?","이 효과는 【진화 시】에도 【어택 시】에도 발휘하는 효과입니다. 진화하여 【진화 시】 효과로서 발휘한 후, 다음 턴 이후에 이 디지몬으로 어택하면, 다시 【어택 시】 효과로서 발휘합니다."],["BT7-029","이 카드의 【진화 시】【어택 시】는 ［턴에 1회］라고 되어 있는데, 같은 턴에 진화하여 어택했을 때, 각각 1회씩 발휘할 수 있습니까?","아니요. 타이밍이 달라도 같은 효과이기 때문에, 【진화 시】로 발휘한 턴에는 더 이상 【어택 시】로는 발휘할 수 없습니다."]],"rules":[["3-5","패"],["3-1-3","영역의 룰"],["4-8","진화원"],["4-16","파기"],["15-16-7","【메인】"]]},{"id":"P346","p":346,"size":4,"cards":4,"qa":2,"label":"【시큐리티】 메모리를 +2 한다.","types":"메모리 증가","sub":"【시큐리티】","comm":1,"pr":1.67,"cardList":[["BT2-107","다크니스 크로우"],["BT4-111","잭 레이드"],["EX1-068","얼음 빙벽!!"],["ST2-13","해머 스파크"]],"qaList":[["ST2-13","이 카드의 【시큐리티】 효과로 메모리가 자신 쪽의 1 이상으로 이동하면, 그 시점에 상대방의 턴이 종료되나요?","네, 종료됩니다. 그러나 턴 교대는 어택 종료 후에 이루어지므로, ≪시큐리티 어택+≫ 등의 효과를 통해 아직 어택이 계속될 경우에는 그것이 해결될 때까지 턴은 교대하지 않습니다."],["EX1-068","이 카드를 사용한 다음 상대의 턴, 상대의 디지몬이 ≪진격≫ 효과로, 메모리가 자신 쪽에 1 이상 넘어온 상태로 어택했습니다. 이 경우, 메모리는 자신의 입장에서 +2 되나요?","네, 메모리가 자신 쪽으로 1 이상이라도, ≪진격≫으로 어택 중에는 아직 상대의 턴이기 때문에, 이 카드로 인해 부여된 효과는 유효하여, 자신의 입장에서 메모리+2 됩니다."]],"rules":[["15-16-10","【시큐리티】"],["13-1","시큐리티 체크"],["4-1","메모리"]]},{"id":"P35","p":35,"size":35,"cards":35,"qa":10,"label":"【메인】 DP 4000 이하의 상대의 디지몬 1마리를 소멸시킨다.","types":"소멸","sub":"【메인】","comm":1,"pr":2.851,"cardList":[["BT10-096","버닝 스타 크래셔"],["BT11-096","마그마 폭탄"],["BT11-097","크림슨 플레어"],["BT11-110","이블스 콜"],["BT12-108","슈퍼 제노사이드 어택"],["BT12-110","세븐스 ･ 풀 ･ 클러스터"],["BT14-100","패왕권"],["BT15-009","메라몬"],["BT15-097","얼티메이트 슬라이서"],["BT16-098","도루딘"],["BT2-091","볼케닉 ･ 플레어"],["BT2-109","히트 ･ 바이퍼"],["BT2-110","트럼프검"],["BT23-097","세븐스 ･ 페네트레이트"],["BT3-098","플라즈마 스테이크"],["BT4-110","다크 로어"],["BT4-112","헬즈 게이트"],["BT6-095","해피 불릿 샤워링"],["BT6-105","게발트 슈베르머"],["BT6-106","철권제재"],["BT6-109","플라이 불릿"],["BT7-093","염룡격"],["BT7-094","지가 스톰"],["BT7-108","슈발츠 ･ 레르자츠"],["BT8-107","팬더모니엄 플레임"],["EX2-051","ADR-07=팰러츠 헤드"],["EX4-069","가이아 리액터"],["ST1-15","기가 디스트로이어"],["ST1-16","가이아 포스"],["ST12-16","지진! 천둥! 화재! 아버지!"],["ST13-15","﻿다이렉트 스매셔"],["ST14-12","견원의 흉탄"],["ST16-16","볼디 블로우"],["ST5-16","제노사이드 어택"],["ST6-15","데스 클로"]],"qaList":[["ST1-16","이 카드의 【메인】 효과로 소멸한 디지몬의 진화원 카드는 어떻게 되나요?","버리는 패가 됩니다."],["ST1-15","이 카드의 【메인】 효과로 소멸한 디지몬의 진화원 카드는 어떻게 되나요?","버리는 패가 됩니다."],["BT4-110","이 카드의 「특징에 「D-브리가드」를 가지는 자신의 디지몬 1마리마다, 이 효과로 선택할 수 있는 등장 코스트를 +1 한다.」란 무엇을 의미합니까?","특징에 「D-브리가드」를 가지는 자신의 디지몬 1마리가 있으면, 이 카드 효과의 대상이 되는 상대의 디지몬을, 등장 코스트의 수치+1 하고, 등장 코스트 4 이하로부터 선택할 수 있게 됩니다. 2마리 있으면 +2되어"],["BT6-095","「가장 DP가 낮은 상대의 디지몬 전부」란, 구체적으로 무슨 뜻인가요?","배틀 에어리어의 상대 디지몬 중, DP가 가장 낮은 디지몬을 가리키며, 혹 해당하는 디지몬이 여러 마리 있을 경우에는, 그 모두를 대상으로 합니다."],["BT6-105","이 카드의 효과는 등장 코스트 7 이하의 자신의 디지몬도 소멸하나요?","네, 자신과 상대 양쪽의, 등장 코스트 7 이하의 디지몬 모두가 소멸합니다."],["BT6-106","「가장 등장 코스트가 높은 상대 디지몬 전부」 란, 구체적으로 무슨 뜻인가요?","배틀 에어리어에 있는 상대 디지몬 중, 등장 코스트가 가장 높은 디지몬을 가리키며, 혹 해당하는 디지몬이 여러 마리 있을 경우, 그 모두를 대상으로 합니다."]],"rules":[["15-16-7","【메인】"],["4-15","소멸"],["15-6","처리 조건"],["4-27","「마다」"],["15-14-1","[턴 X회]"]]},{"id":"P102","p":102,"size":13,"cards":12,"qa":3,"label":"【메인】 자신의 트래시에서, 퍼플인 Lv.5 디지몬 카드 1장을 코스트를 지불하지 않고 등장시킨다. 이 효과로 등장한 디지몬의 【등장 시】 효과","types":"등장 / 유발 · 상대의 디지몬 · 등장함 / 효과 발휘 금지","sub":"【어택 시】","comm":0,"pr":0.57,"cardList":[["BT10-083","미네르바몬"],["BT2-038","라이즈그레이몬"],["BT2-080","피에몬"],["BT2-081","메탈가루몬"],["BT2-108","나이트 레이드"],["BT3-110","네크로포비아"],["BT5-078","조커몬"],["BT5-106","데몬즈 디제스터"],["EX1-063","베놈묘티스몬"],["EX1-063P","베놈묘티스몬"],["P-020","베놈묘티스몬"],["ST6-16","어둠의 저주"]],"qaList":[["ST6-16","이 카드의 효과는 자신의 트래시에 퍼플인 Lv.3 또는 Lv.4의 디지몬 카드가 둘 중 1장밖에 없을 경우에도 사용할 수 있나요?","네, 사용할 수 있습니다. 퍼플인 Lv.3 또는 Lv.4의 디지몬 카드가 어느 쪽 1장밖에 없을 경우에는, 트래시에 있는 쪽의 디지몬 카드만을 등장시킵니다."],["ST6-16","이 카드의 【메인】 효과로 등장시킬 수 있는 카드는 무엇인가요?","『퍼플인 Lv.3의 디지몬 카드』 1장과 『퍼플인 Lv.4의 디지몬 카드』 1장입니다."],["EX1-063","이 카드의 【어택 시】효과로, 트래시에서 진화원 효과에 ≪길동무≫를 갖고 있는 퍼플의 Lv.4 이하의 디지몬 카드를 등장시킬 수 있습니까?","아니요, 할 수 없습니다."]],"rules":[["4-2","코스트"],["7-1","등장"],["15-4","효과의 상태"],["15-9-2","임의 처리"],["15-16-5","【어택 시】"]]},{"id":"P347","p":347,"size":4,"cards":4,"qa":1,"label":"【진화 시】상대의 디지몬 1마리를 《퇴화 1》(겹쳐진 카드를 위에서부터 1장 파기한다. Lv.3의 카드 이후는 파기할 수 없다).","types":"퇴화 / 파기","sub":"【등장 시】","comm":13,"pr":1.498,"cardList":[["BT13-065","화이트스카몬"],["EX4-036","블랙래피드몬"],["P-015","인펠몬"],["ST15-10","안드로몬"]],"qaList":[["EX4-036","이 카드의 【어택 종료 시】의 《퇴화 1》의 대상은 어떻게 되나요?","상대의 디지몬 1마리가 대상이 됩니다."]],"rules":[["16-12","《퇴화》"],["4-16","파기"],["15-16-2","【등장 시】"],["15-16-15","【어택 종료 시】"],["15-16-4","【소멸 시】"]]},{"id":"P437","p":437,"size":3,"cards":3,"qa":4,"label":"【자신의 턴】 [턴에 1회] 상대 디지몬의 진화원을 파기했을 때, 메모리를 +1 한다.","types":"메모리 증가 / 진화원 제거","sub":"【자신의 턴】","comm":8,"pr":1.166,"cardList":[["BT2-085","정석"],["BT5-022","블루코몬"],["P-004","쉬라몬"]],"qaList":[["P-004","「상대의 디지몬 1마리를 패로 되돌린다. 그 디지몬이 가지는 진화원은 파기한다.」 효과를 발휘했을 때, 상대의 진화원을 파기한 것으로 보아 이 카드의 효과를 발휘할 수 있습니까?","아니요. 안됩니다. 「그 디지몬이 가지는 진화원은 파기한다.」는 패로 되돌아간 디지몬의 진화원인 카드가 어떻게 되는가를 설명할 뿐으로, 이 카드의 효과에 의해 파기된 것으로 보지 않습니다."],["BT2-085","「상대의 디지몬 1마리를 패로 되돌린다. 그 디지몬이 가지는 진화원은 파기한다」의 효과를 발휘했을 때, 상대의 진화원을 파기했다고 간주해, 이 카드의 효과를 발휘할 수 있습니까?","아니요, 할 수 없습니다. 「그 디지몬이 가진 진화원은 파기한다」란 패에 되돌아간 디지몬의 진화원의 카드가 어떻게 된다고 설명한 내용이며, 상대 디지몬의 진화원을 파기한 것으로는 간주하지 않습니다."],["BT5-022","이 카드의 진화원 효과는 상대의 디지몬을 패로 되돌렸을 때 메모리를 +1 할 수 있습니까?","아니요, 디지몬을 패로 되돌리는 효과로는 진화원을 파기했다고는 간주하지 않으므로 메모리 +1은 되지 않습니다."],["BT5-022","이 카드의 진화원 효과는 상대 디지몬 2마리의 진화원을 동시에 파기했을 때 메모리를 +2 할 수 있습니까?","아니요, 동시에 여러 상대 디지몬의 진화원을 파기한다고 해도, 이 효과로는 1턴에 메모리 +1까지만 할 수 있습니다."]],"rules":[["15-16-8","【자신의 턴】【상대의 턴】"],["4-1","메모리"],["4-8","진화원"],["15-5","유발 조건"],["15-8-3","유발형 효과"]]},{"id":"P230","p":230,"size":6,"cards":6,"qa":7,"label":"【등장 시】 자신의 덱 위에서 5장 오픈한다. 그 중 테이머 카드 1장을 패에 추가한다. 남은 카드는 원하는 순서대로 덱 아래로 되돌린다.","types":"덱으로 되돌림 / 패로 회수","sub":"【등장 시】","comm":2,"pr":1.341,"cardList":[["BT1-010","아구몬"],["BT1-048","파닥몬"],["BT1-067","팔몬"],["BT1-074","니드몬"],["BT1-088","장한솔"],["BT2-044","티라노몬"]],"qaList":[["BT1-010","이 디지몬의 효과로 레드 이외의 테이머 카드를 패에 추가하는 것은 가능한가요?","네, 가능합니다."],["BT1-010","덱이 4장 이하일 때, 이 카드의 효과는 발휘할 수 있나요?","네, 가능합니다. 그 경우는 가능한 한 덱의 카드를 오픈합니다."],["BT1-048","덱이 3장 이하일 때, 이 카드의 효과는 발휘할 수 있나요?","네, 가능합니다. 그 경우는 가능한 한 덱의 카드를 오픈합니다."],["BT1-067","이 카드의 효과로 그린 이외의 Lv.4의 디지몬 카드를 패에 추가할 수 있나요?","네, 가능합니다."],["BT1-074","이 카드의 효과로 그린 이외의 Lv.5 이상의 디지몬 카드를 패에 추가할 수 있나요?","네, 가능합니다."],["BT2-044","이 카드의 효과로 오픈한 3장의 카드 중에서 Lv.5의 디지몬 카드와 그린인 테이머 카드가 양쪽 다 없다면 패에 넣을 수 없나요?","아뇨, Lv.5인 디지몬 카드와 그린인 테이머 카드 중 어느 하나만 있더라도 패에 추가할 수 있습니다."]],"rules":[["3-5","패"],["3-1-3","영역의 룰"],["3-2","덱"],["15-16-2","【등장 시】"],["15-16-3","【진화 시】"]]},{"id":"P438","p":438,"size":3,"cards":3,"qa":0,"label":"【메인】 《디지버스트 2》 (이 디지몬의 진화원을 2장 골라 파기하는 것으로 이하의 효과를 발휘한다) ・이 턴 동안, 자신의 디지몬 1마리는 《","types":"다른 효과 발휘 / 진화원 제거 / 키워드 부여","sub":"【메인】","comm":20,"pr":1.856,"cardList":[["BT5-057","로제몬"],["BT7-034","필몬"],["P-025","그랜쿠가몬"]],"qaList":[],"rules":[["15-16-7","【메인】"],["16-4","《S 어택》(※구 《시큐리티 어택》)"],["16-14","《디지버스트》"],["15-13","효과 부여"],["15-15-2","「얻는다・준다」"]]},{"id":"P171","p":171,"size":8,"cards":8,"qa":2,"label":"【자신의 턴】 이 디지몬이 명칭에 「에테몬」을 포함하는 동안, 이 디지몬은 《재밍》 (이 디지몬은 시큐리티 디지몬과의 배틀에서는 소멸하지 않는다","types":"소멸 내성 / 키워드 부여","sub":"【자신의 턴】","comm":7,"pr":0.614,"cardList":[["BT2-026","브이드라몬"],["BT2-028","에어로브이드라몬"],["BT3-030","두프트몬"],["BT5-029","워가루몬: 사지타리우스 모드"],["BT6-024","모털몬"],["BT6-033","펄스몬"],["EX1-052","에테몬"],["P-135","슈슈몬"]],"qaList":[["BT2-028","이 카드를 진화원으로 가진 디지몬이 메인 페이즈에서 액티브 상태일 때 「자신의 디지몬을 액티브로 한다」 효과를 받는다면, 이 진화원 효과는 발휘됩니까?","아니요, 이미 액티브 상태일 때엔 「액티브로 한다」 효과를 받더라도, 「액티브가 되었을 때」라고 치지 않기 때문에 발휘하지 않습니다."],["BT3-030","이 카드의 【자신의 턴】 효과로 《재밍》을 얻은 Lv.4인 자신의 디지몬이 진화하여 Lv.5 이상이 되었다면 《재밍》을 잃게 되나요?","네, 【자신의 턴】 효과이므로 Lv.5 이상이 된 시점에서 효과 대상이 아니게 되므로 《재밍》을 잃습니다."]],"rules":[["15-16-8","【자신의 턴】【상대의 턴】"],["16-9","《재밍》"],["4-15","소멸"],["15-13","효과 부여"],["15-15-2","「얻는다・준다」"]]},{"id":"P202","p":202,"size":7,"cards":7,"qa":0,"label":"《흡수진화 -3》 (자신의 디지몬이 패의 이 카드로 진화할 때, 자신의 디지몬 1마리를 레스트시키는 것으로, 지불하는 진화 코스트를 -3 한다)","types":"키워드 · 《흡수 진화》","sub":"","comm":19,"pr":2.087,"cardList":[["BT2-045","아르고몬"],["BT2-047","아르고몬"],["BT2-050","아르고몬"],["BT3-054","브롯사몬"],["BT3-056","케레스몬"],["BT5- 】 효과는 「P-104 멘탈・트레이닝」 등의 진화시키는 효과와 동시에 발휘할 수 있나요?","네, 가능합니다."],["BT6-060","자신의 디지몬을 진화시키는 효과로, 이 디지몬에서 패에 특징으로 「삼총사」 를 가진 디지몬 카드로 진화시킬 수 있습니까?","네, 가능합니다."],["BT6-060","특징으로 「3총사」를 가진 듀얼 카드를 옵션 카드로서 패에서 사용했습니다. 그 뒤에 아츠 진화로 이 카드를 사용한 그 카드로 진화 조건을 무시하고 진화시킬 수 있나요?","아니요, 할 수 없습니다. 사용한 옵션 카드는 【메인】 효과가 해결되어 파기될 때까지 어느 영역에도 속하지 않는 것으로 취급합니다. 패의 카드로 취급하지 않기 때문에 진화 조건을 무시할 수 없습니다."],["BT6-060","이 카드의 【자신의 턴】 효과는 「P-107 디펜스・트레이닝」 등 진화시키는 효과와 동시에 발휘할 수 있나요?","네, 가능합니다."]],"rules":[["15-16-8","【자신의 턴】【상대의 턴】"],["8-1","진화"],["15-9-2","임의 처리"],["15-5","유발 조건"],["15-8-3","유발형 효과"]]},{"id":"P351","p":351,"size":4,"cards":4,"qa":3,"label":"【소멸 시】 자신의 덱 위에서부터 2장 파기한다.","types":"파기","sub":"【소멸 시】","comm":12,"pr":1.055,"cardList":[["BT18-006","프리몬"],["BT2-068","임프몬"],["BT4-088","단데블몬"],["ST6-01","퍼그몬"]],"qaList":[["ST6-01","이 카드의 효과에 의해 덱 매수가 0매 이하가 되었을 경우, 즉시 게임에서 패배하나요?","아니요, 다음 자신의 드로우 페이즈가 될 때까지는, 덱이 0매가 된 것으로 인한 패배로는 처리되지 않습니다."],["BT4-088","이 카드의 【소멸 시】 효과로 파기하는 패는 파기하는 쪽 플레이어가 선택합니까?","네, 패를 파기할 플레이어가 2장을 선택하여 파기합니다."],["BT18-006","배틀 에어리어에 상대의 「레드와 블루인 디지몬」과 「레드와 옐로인 테이머」가 1명씩 있는 상황입니다. 이 카드의 진화원 효과를 발휘한 경우, 자신의 덱 위에서 몇 장 파기합니까?","3장입니다. 이 상황의 경우, 상대의 디지몬과 테이머의 색이 「레드와 블루와 옐로」 3개이므로 자신의 덱 위에서 3장 파기합니다."]],"rules":[["15-16-4","【소멸 시】"],["4-16","파기"],["15-3","진화원 효과"],["4-27","「마다」"]]},{"id":"P280","p":280,"size":5,"cards":5,"qa":3,"label":"【서로의 턴】레드인 자신의 디지몬이 있는 동안, 이 디지몬은 《길동무》 (배틀에서 이 디지몬만이 소멸했을 때, 배틀한 상대의 디지몬을 소멸시킨다","types":"소멸 / 키워드 부여","sub":"【서로의 턴】","comm":21,"pr":1.901,"cardList":[["BT10-071","가지몬"],["BT2-071","위자몬"],["BT4-006","샤오몬"],["EX3-055","추추몬"],["ST10-12","레이디데블몬"]],"qaList":[["BT4-006","자신의 트래시가 9장일 때, 이 카드를 진화원으로 가진 디지몬이 배틀로 소멸했을 때, 소멸로 인해 이 카드를 포함한 디지몬 카드가 트래시에 놓여, 트래시가 10장 이상이 되었습니다만 이 때, 이 카드의 ≪길동무≫ 효과는 발휘하나요?","아니요, 트래시에 이동한 시점에 이 카드의 진화원 효과는 상실되기 때문에, 발휘하지 않습니다."],["BT4-006","자신의 트래시가 10장 이상일 때, 이 카드를 진화원으로 가진 디지몬이 배틀로 소멸했습니다. 이 카드보다 먼저 다른 효과를 먼저 발휘함으로써 트래시의 카드가 9장 이하가 되었습니다. 이 때 이 카드의 ≪길동무≫ 효과는 발휘하나요?","네, 소멸한 시점에서 트래시에 카드가 10장 이상 있었다면 ≪길동무≫가 발휘합니다."],["BT10-071","자신의 트래시가 9장일 때에 이 카드를 진화원에 가진 디지몬이 배틀로 소멸하여 트래시에 놓여 트래시가 10장 이상이 되었습니다. 이 경우 이 카드의 진화원 효과로 ≪길동무≫를 발휘하여 배틀한 상대의 디지몬을 소멸시킬 수 있습니까?","아니요. 이 카드를 진화원에 가진 디지몬이 소멸한 후에 트래시가 10장이 되었기 때문에 소멸한 시점에는 이 카드의 진화원 효과는 발휘하고 있지 않습니다."]],"rules":[["16-13","《길동무》"],["4-15","소멸"],["15-13","효과 부여"],["15-15-2","「얻는다・준다」"],["15-5","유발 조건"]]},{"id":"P232","p":232,"size":6,"cards":6,"qa":1,"label":"【어택 시】[턴에 1회]다른 자신의 디지몬 1마리를 소멸시키는 것으로, 이 디지몬을 액티브로 한다.","types":"소멸 / 액티브","sub":"【어택 시】","comm":4,"pr":1.428,"cardList":[["BT13-091","벨페몬: 레이지 모드"],["BT2-078","워가루몬"],["BT5-079","블랙메가로그라우몬"],["BT5-106","데몬즈 디제스터"],["EX5-061","케르베로스몬 X항체"],["EX8-060","묘티스몬"]],"qaList":[["BT2-078","이 카드의 효과는 육성 에어리어에 있는 자신의 디지몬을 소멸시킬 수 있나요?","아니요, 할 수 없습니다."]],"rules":[["4-15","소멸"],["4-13","표시 형식"],["15-3","진화원 효과"],["15-16-5","【어택 시】"],["15-14-1","[턴 X회]"]]},{"id":"P352","p":352,"size":4,"cards":4,"qa":0,"label":"【자신의 턴】[턴에 1회]상대의 디지몬이 레스트했을 때, 메모리 +1.","types":"메모리 증가 / 유발 · 상대의 디지몬 · 레스트함","sub":"【자신의 턴】","comm":8,"pr":1.352,"cardList":[["BT10-051","진바앙고라몬"],["BT2-079","베놈묘티스몬"],["EX3-045","히드라몬"],["ST4-14","장한솔"]],"qaList":[],"rules":[["4-1","메모리"],["15-5","유발 조건"],["15-8-3","유발형 효과"],["4-13","표시 형식"],["15-16-8","【자신의 턴】【상대의 턴】"]]},{"id":"P281","p":281,"size":5,"cards":5,"qa":2,"label":"【자신의 턴】 [턴에 1회] 이 디지몬이 메인 페이즈에서 액티브 상태가 되었을 때, 메모리를 +1 한다.","types":"메모리 증가","sub":"【자신의 턴】","comm":8,"pr":2.117,"cardList":[["BT11-112","시노미야 리나"],["BT2-004","아르고몬"],["BT2-032","알포스브이드라몬"],["BT7-026","워가루몬"],["BT9-089","니시지마 다이고"]],"qaList":[["BT2-004","이 카드를 진화원으로 가지고 있는 디지몬이 액티브 페이즈에서 원래 액티브 상태일 때, 이 진화원 효과는 발휘합니까?","아니요, 원래 액티브 상태일 때 액티브 페이즈가 되더라도 「액티브가 되었을 때」라고 치지 않기 때문에 발휘하지 않습니다."],["BT2-032","이 디지몬이 메인 페이즈에서 액티브 상태일 때 「자신의 디지몬을 액티브로 한다」는 효과를 받으면 「메모리를 +1한다」 효과는 발휘합니까?","아니요, 이미 액티브 상태일 때 「액티브로 한다」 효과를 받아도 「액티브가 되었을 때」로 치지 않으므로 발휘하지 않습니다."]],"rules":[["4-1","메모리"],["15-5","유발 조건"],["15-8-3","유발형 효과"],["15-16-8","【자신의 턴】【상대의 턴】"],["15-14-1","[턴 X회]"]]},{"id":"P354","p":354,"size":4,"cards":4,"qa":2,"label":"【어택 시】 플레이어에게 어택했을 때, 《1 드로우》 (자신의 덱에서 카드를 1장 드로우한다).","types":"드로우 / 유발 · 어택함","sub":"【어택 시】","comm":4,"pr":3.519,"cardList":[["BT2-015","가루다몬"],["EX1-002","피요몬"],["EX1-002P","피요몬"],["EX1-010","페닉스몬"]],"qaList":[["BT2-015","이 디지몬이 상대 플레이어에게 어택하여 상대 디지몬에게 블록되었습니다. 이 경우, 이 디지몬의 효과는 발휘됩니까?","네, 블록되었다고 해도 상대 플레이어에 대해 어택을 선언했다면 효과는 발휘합니다."],["EX1-002","이 카드를 진화원으로 가진 디지몬이 상대 플레이어에 어택하여, 상대의 디지몬에 블록되었습니다. 이 경우, 이 카드의 효과는 발휘합니까?","네, 발휘합니다. 【어택 시】효과는, 상대의 블록 선언보다도 먼저 효과를 발휘합니다."]],"rules":[["15-16-5","【어택 시】"],["4-14","드로우"],["15-5","유발 조건"],["15-8-3","유발형 효과"],["11","어택"]]},{"id":"P443","p":443,"size":3,"cards":3,"qa":2,"label":"【어택 시】〔턴에 1회〕 플레이어에게 어택했을 때, 메모리를 +1 한다.","types":"메모리 증가 / 유발 · 어택함","sub":"【어택 시】","comm":4,"pr":2.708,"cardList":[["BT2-019","페닉스몬"],["EX1-006","가루다몬"],["EX1-006P","가루다몬"]],"qaList":[["BT2-019","이 디지몬이 상대 플레이어에게 어택하여 상대 디지몬에게 블록되었습니다. 이 경우, 이 디지몬의 효과는 발휘됩니까?","네, 블록되었다고 해도 상대 플레이어에 대해 어택을 선언했다면 효과는 발휘합니다."],["EX1-006","이 카드를 진화원으로 가진 디지몬이 상대 플레이어에 어택하여, 상대의 디지몬에 블록되었습니다. 이 경우, 이 카드의 효과는 발휘합니까?","네, 발휘합니다. 【어택 시】효과는, 상대의 블록 선언보다도 먼저 효과를 발휘합니다."]],"rules":[["15-16-5","【어택 시】"],["4-1","메모리"],["15-5","유발 조건"],["15-8-3","유발형 효과"],["11","어택"]]},{"id":"P233","p":233,"size":6,"cards":6,"qa":2,"label":"패의 이 카드를 등장시킬 때, 그린인 자신의 디지몬이 있다면 지불하는 등장 코스트를 -1 한다.","types":"상시·기타 문장","sub":"","comm":2,"pr":1.366,"cardList":[["BT2-023","쉬라몬"],["BT2-112","블랙워그레이몬"],["BT4-115","루체몬"],["BT7-015","어벤지키드몬"],["ST9-04","엑스브이몬"],["ST9-09","스팅몬"]],"qaList":[["BT2-023","이 카드의 효과는 진화원을 갖지 않는 상대 디지몬이 5마리 이상 있을 때, 코스트를 -5 하면 등장 코스트 -1이 되므로 메모리를 +1 하여 등장시키면 되나요?","아니요, 등장 코스트는 0으로 하여 등장시켜 주십시오. 등장 코스트는 마이너스가 될 수 없으며, 0이 가장 낮은 수치입니다."],["BT7-015","이 카드의 등장 코스트는 자신과 상대 중 한 명의 트래시에 있는 옵션 카드의 매수만큼만 코스트를 마이너스합니까?","아니요. 자신과 상대의 트래시에 있는 옵션 카드의 매수의 합계만큼 등장 코스트를 마이너스 합니다."]],"rules":[["7-1","등장"],["4-27","「마다」"],["15-6","처리 조건"]]},{"id":"P444","p":444,"size":3,"cards":3,"qa":1,"label":"【자신의 턴】 자신의 테이머 1명마다, 이 디지몬의 DP를 +1000 한다.","types":"DP 증가","sub":"【자신의 턴】","comm":5,"pr":2.26,"cardList":[["BT17-076","에오스몬"],["BT2-041","샤인그레이몬"],["BT9-041","라이즈그레이몬 X항체"]],"qaList":[["BT17-076","이 카드의 【자신의 턴】효과는 이 카드 자신이 등장했을 때 유발합니까?","네, 유발합니다."]],"rules":[["15-16-8","【자신의 턴】【상대의 턴】"],["2-5","DP（디지몬 파워）"],["15-15-4","효과의 수치를 플러스・마이너스하는 효과"],["4-27","「마다」"]]},{"id":"P173","p":173,"size":8,"cards":8,"qa":0,"label":"【자신의 턴】 이 디지몬의 색은 옐로로도 취급한다.","types":"취급 변경","sub":"【자신의 턴】","comm":5,"pr":1.18,"cardList":[["BT3-014","실피드몬"],["BT3-040","토우몬"],["BT4-017","라이즈그레이몬"],["BT6-013","메가드라몬"],["BT6-061","기가드라몬"],["BT6-077","리벨리몬"],["EX1-005","티라노몬"],["EX1-005P","티라노몬"]],"qaList":[],"rules":[["15-12","정보 추가 효과・정보 변경 효과"],["15-16-8","【자신의 턴】【상대의 턴】"],["15-16-9","【서로의 턴】"]]},{"id":"P445","p":445,"size":3,"cards":3,"qa":5,"label":"【상대의 턴】 진화원을 갖지 않은 상대의 디지몬 전부에게 《시큐리티 어택 -1》 (이 디지몬이 체크하는 시큐리티의 매수 -1)을 준다.","types":"키워드 부여","sub":"【상대의 턴】","comm":7,"pr":0.94,"cardList":[["BT3-040","토우몬"],["EX2-054","ADR-09=게이트 키퍼"],["EX5-033","미타마몬"]],"qaList":[["BT3-040","이 디지몬이 상대편에 있을 때, 진화원이 없는 자신의 디지몬을 진화시켜 진화원을 얻으면, 《시큐리티 어택-1》은 즉시 사라집니까?","네, 진화원을 얻은 시점에서 이 카드의 효과에 의한 《시큐리티 어택-1》의 대상에서 벗어나게 됩니다."],["EX2-054","≪시큐리티 어택+1≫을 가진 상대 디지몬이 플레이어에 어택하고 첫 번째 체크로 이 카드가 넘겨져서 【시큐리티】 효과로 배틀 에어리어에 등장했습니다. 진화원을 6장 이상 가진 자신의 「마더 디・리퍼」가 있는 경우, 이 카드의 【상대의 턴】 효과로 상대의","네. 2장 째의 체크 전에 이 카드의 【상대의 턴】 효과로 어택한 상대의 디지몬에게 ≪시큐리티 어택-1≫이 발휘되어 2장 째의 체크는 실행되지 않고 어택이 종료됩니다."],["EX5-033","이 카드의 【상대의 턴】 효과는 구체적으로 어떤 효과인가요?","서로의 시큐리티 합계 이상의 Lv.을 가진 상대의 디지몬 전부에게 《S 어택 -2》를 주는 효과입니다.\n 예를 들어 서로의 시큐리티 합계가 6장이라면, Lv.6 이상의 상대의 디지몬 전부에게 《S 어택 -2》를 줍니"],["EX5-033","이 카드의 【상대의 턴】 효과의 「서로의 시큐리티 합계」는 무엇을 뜻하는 것인가요?","자신과 상대, 각각의 시큐리티 매수를 합산한 수치를 뜻합니다.\n 예를 들어, 자신의 시큐리티가 3장, 상대의 시큐리티가 2장이라면 서로의 시큐리티 합계는 5장이 됩니다."],["EX5-033","이 카드의 【상대의 턴】 효과는 시큐리티의 매수가 줄어들었을 경우, 그 시점에 《S 어택 -2》를 주는 대상이 되는 Lv.도 낮아지나요?","네, 그렇습니다."]],"rules":[["15-16-8","【자신의 턴】【상대의 턴】"],["16-4","《S 어택》(※구 《시큐리티 어택》)"],["15-13","효과 부여"],["15-15-2","「얻는다・준다」"]]},{"id":"P234","p":234,"size":6,"cards":6,"qa":2,"label":"【소멸 시】 자신의 덱 위에서부터 3장 오픈한다. 그 중 「츄몬」 1장을 코스트를 지불하지 않고 등장시킬 수 있다. 남은 카드는 원하는 순서대로","types":"덱 위 확인 / 덱으로 되돌림 / 등장","sub":"【소멸 시】","comm":3,"pr":1.891,"cardList":[["BT3-063","스카몬"],["BT3-070","에테몬"],["BT3-073","크레스가루몬"],["BT4-063","코만드라몬"],["BT5-060","모니터몬"],["EX2-053","ADR-08=옵티마이저"]],"qaList":[["BT3-073","이 카드의 【진화 시】 효과로 등장시킬 수 있는 카드는 무엇인가요?","『블랙인 Lv.5 이하의 디지몬 카드』 또는 『레드인 Lv.5 이하의 디지몬 카드』 1장입니다."],["EX2-053","이 카드는 Lv.이 없는데 이 카드에서 진화하거나 이 카드로 진화할 수 있습니까?","아니요. Lv.이 없는 카드에서는 진화할 수 없고 이 카드로 진화도 할 수 없습니다(특수 진화 제외)."]],"rules":[["3-2","덱"],["3-1-3","영역의 룰"],["4-2","코스트"],["7-1","등장"],["15-15-3","공개하는 효과"]]},{"id":"P446","p":446,"size":3,"cards":3,"qa":0,"label":"【어택 시】 이 디지몬이 Lv.7일 때, 상대의 디지몬 1마리를 《퇴화 1》 (상대 디지몬 위에 포개진 카드를 위에서부터 1장 파기한다. 진화원","types":"퇴화 / 파기","sub":"【어택 시】","comm":13,"pr":2.477,"cardList":[["BT3-064","티아루도몬"],["BT3-069","라이지루도몬"],["EX2-035","사이버드라몬"]],"qaList":[],"rules":[["15-3","진화원 효과"],["15-16-5","【어택 시】"],["16-12","《퇴화》"],["4-16","파기"],["15-14-1","[턴 X회]"]]},{"id":"P282","p":282,"size":5,"cards":5,"qa":6,"label":"【서로의 턴】자신의 「노유빈」 전부는 소멸하지 않는다.","types":"소멸 내성","sub":"【서로의 턴】","comm":10,"pr":2.322,"cardList":[["BT11-082","츠와몬"],["BT14-062","데이터몬"],["BT18-086","루체몬: 라르바"],["BT3-075","크레니엄몬"],["EX8-068","딥 세이버즈"]],"qaList":[["BT3-075","이 카드의 【서로의 턴】 효과의, 「상대방의 효과로 소멸하지 않는다」라고 하는 것은 구체적으로 무엇을 의미합니까?","카드 텍스트에 「소멸시킨다」가 있는 어떤 효과의 대상이 되어도 소멸하지 않는다는 것입니다. 배틀에서의 패배나 무승부, DP가 0이 된 것에 의한 소멸은 발생합니다."],["BT11-082","이 디지몬과 자신의 「아마노 유우」가 동시에 소멸하는 효과를 받았을 때, 이 카드의 효과로 자신의 「아마노 유우」는 소멸하지 않습니까?","네, 소멸하지 않습니다."],["BT14-062","이 카드의 【서로의 턴】 효과의 「상대의 효과로 소멸하지 않는다」란 구체적으로 어떤 효과인가요?","카드 텍스트에 「소멸시킨다」라고 적힌 효과의 대상이 되어도 소멸하지 않는다는 것입니다. 배틀에서 패배, 무승부 및 DP 0이 된 것에 의한 소멸은 발생합니다."],["BT18-086","이 카드의 【서로의 턴】효과는 어떤 효과입니까?","DP 0인 자신의 디지몬 전부가 소멸하지 않게 만드는 효과입니다. 효과에 의한 소멸이나, 룰에 의한 소멸≪DP 0인 디지몬이 룰체크 타이밍에 소멸하는 룰이나 배틀에서 패배한 것에 의한 소멸≫을 하지 않게 됩니다."],["EX8-068","자신의 시큐리티에 이 카드가 앞면으로 놓여 있는 상황입니다. 상대의 디지몬이 진화하여 메모리가 1 이상이 되었습니다. 이때, 진화한 상대의 디지몬이 효과를 발휘하여 특징으로 「DS」를 가진 자신의 디지몬에게 어택한 경우, 이 카드의 【서로의 턴】효과로","네, 소멸하지 않습니다. 메모리가 1 이상이 "BT20-078","고쿠몬"],["BT5-112","오메가몬 즈왈트 DEFEAT"],["BT6-064","콩알몬"],["BT6-070","에렉몬"],["EX10-054","베놈묘티스몬"],["EX4-056","야타가라몬"],["EX5-010","산티라몬"],["EX5-013","주작몬 ACE"],["EX5-024","청룡몬 ACE"],["EX5-041","현무몬 ACE"],["EX5-053","백호몬 ACE"],["EX6-045","츠카이몬"],["EX8-010","메라몬"],["EX9-060","데블드라몬"]],"qaList":[["EX4-056","이 카드를 진화원으로 가진 디지몬이 상대의 《길동무》로 소멸했을 경우, 이 카드의 【소멸 시】효과는 발휘하나요?","네, 발휘합니다.\n 《길동무》의 효과에 의한 소멸은 배틀로 소멸한 것으로 취급하지 않습니다."],["BT13-006","이 카드의 【소멸 시】의 진화원 효과는 이 카드를 진화원으로 가진 디지몬이 소멸했을 때, Lv.3의 상대의 디지몬이 없어도, 패를 1장 파기할 수 있나요?","네, 가능합니다. 상대의 디지몬을 소멸시키는 것은 불가능하지만, 패를 파기하는 것은 가능합니다."]],"rules":[["15-16-4","【소멸 시】"],["4-15","소멸"],["15-3","진화원 효과"],["15-16-2","【등장 시】"]]},{"id":"P355","p":355,"size":4,"cards":4,"qa":4,"label":"【메인】DP의 합계가 10000 이하가 되도록 상대 디지몬을 골라, 고른 디지몬 전부를 소멸시킨다.","types":"소멸","sub":"【메인】","comm":1,"pr":1.945,"cardList":[["BT8-105","다크 가이아 포스"],["BT9-094","아토믹 메가로 블래스터"],["EX2-011","듀크몬"],["ST7-12","아토믹 블래스터"]],"qaList":[["ST7-12","「DP의 합계가 8000 이하가 되도록 상대 디지몬을 골라」는 구체적으로 어떤 것입니까?","「DP 3000인 디지몬 1마리 + DP 5000인 디지몬 1마리」 혹은, 「DP 2000인 디지몬 2마리 + DP 3000인 디지몬 1마리」 등, DP의 합계가 8000 이하가 되도록 상대의 디지몬을 원하는 수만큼"],["BT8-105","「등장 코스트 합계 15까지 상대의 디지몬을 골라」라는 것은 구체적으로 어떤 것입니까?","「등장 코스트 3인 디지몬 1마리 + 등장 코스트 12인 디지몬 1마리」나 「등장 코스트 2인 디지몬 1마리 + 등장 코스트 6인 디지몬 2마리」처럼 등장 코스트의 합계가 15 이하가 되도록 상대의 디지몬을 원하는 "],["EX2-011","이 카드의 【어택 시】 효과인 「DP의 합계가 6000 이하가 되도록 상대 디지몬을 골라」는 「DP 소멸 효과의 상한 +2000」의 효과를 받습니까?","네. 받습니다. 레드인 자신의 테이머가 있을 때에는 이 효과로 DP의 합계가 8000 이하가 되도록 상대의 디지몬을 선택할 수 있습니다."],["BT9-094","이 카드의 【메인】효과는 「DP소멸 효과의 상한 +1000」의 효과에 의해 DP합계가 11000까지의 상대 디지몬을 소멸시킬 수 있게 됩니까?","네. 가능합니다."]],"rules":[["4-15","소멸"],["15-16-7","【메인】"],["15-16-5","【어택 시】"]]},{"id":"P457","p":457,"size":3,"cards":3,"qa":1,"label":"【상대의 턴】상대의 디지몬이 어택했을 때, 이 테이머를 레스트시키는 것으로, 《1 드로우》 (자신의 덱에서 카드를 1장 드로우한다).","types":"드로우 / 유발 · 상대의 디지몬 · 어택함","sub":"【어택 시】","comm":4,"pr":1.462,"cardList":[["BT6-004","피나몬"],["EX2-058","황주연"],["RB1-033","이청솔"]],"qaList":[["BT6-004","이 카드를 진화원으로 가진 디지몬이 플레이어에게 어택하고, 상대 디지 ypes":"메모리 증가 / 유발 · 자신의 디지몬 · 등장함","sub":"【자신의 턴】","comm":8,"pr":1.965,"cardList":[["BT10-090","최강찬"],["BT13-009","헉몬"],["BT13-013","바오헉몬"],["BT23-006","헉몬"],["BT8-035","캔들몬"],["BT9-091","메이"],["ST12-04","헉몬"]],"qaList":[["ST12-04","명칭에 「시스터몬」을 포함한 자신의 디지몬이 2마리 이상 동시에 등장했을 경우, 등장한 디지몬 1마리마다 메모리 +1합니까?","아니요. 하나의 효과로 명칭에 「시스터몬」을 포함한 자신의 디지몬이 2마리 이상 동시에 등장해도 이 디지몬의 효과로는 메모리 +1만 됩니다."],["BT13-009","명칭에 「시스터몬」을 포함하는 자신의 디지몬이 등장했을 때, 그 디지몬의 【등장 시】효과와 이 카드의 【자신의 턴】효과는 어느 쪽이 먼저 발휘되나요?","동시 유발되기 때문에, 플레이어가 발휘하는 순서를 선택할 수 있습니다."],["BT13-013","명칭에 「시스터몬」을 포함하는 자신의 디지몬을 등장시키고, 이 카드의 【자신의 턴】효과로 이 디지몬을 패의 「세이버헉몬」으로 진화시켰습니다. 그 때, 이 카드의 진화원 효과로 메모리 +1할 수 있나요?","아니요, 불가능합니다. 명칭에 「시스터몬」을 포함하는 자신의 디지몬이 등장했을 때에는 이 디지몬에서 진화하여 진화원 효과를 발휘할 수 있기 전이므로, 진화원 효과는 유발하지 않습니다."],["BT13-013","명칭에 「시스터몬」을 포함하는 자신의 디지몬이 등장했을 때, 그 디지몬의 【등장 시】효과와 이 카드의 【자신의 턴】효과는 어느 쪽이 먼저 발휘하나요?","동시 유발되기 때문에, 플레이어가 발휘하는 순서를 선택할 수 있습니다."]],"rules":[["4-1","메모리"],["15-5","유발 조건"],["15-8-3","유발형 효과"],["7-1","등장"],["15-16-8","【자신의 턴】【상대의 턴】"]]},{"id":"P470","p":470,"size":3,"cards":3,"qa":0,"label":"【서로의 턴】다른 레스트 상태의 자신의 디지몬 1마리마다 이 디지몬을 DP+1000.","types":"DP 증가","sub":"【서로의 턴】","comm":5,"pr":1.826,"cardList":[["BT8-047","펄스몬"],["BT8-050","엑서몬"],["BT8-054","피스트몬"]],"qaList":[],"rules":[["15-3","진화원 효과"],["15-16-9","【서로의 턴】"],["2-5","DP（디지몬 파워）"],["15-15-4","효과의 수치를 플러스・마이너스하는 효과"],["4-27","「마다」"]]},{"id":"P471","p":471,"size":3,"cards":3,"qa":0,"label":"《흡수진화-2》 (자신의 디지몬이 패의 이 카드로 진화할 때, 자신의 디지몬 1마리를 레스트시키는 것으로, 지불하는 진화 코스트 -2)","types":"키워드 · 《흡수 진화》","sub":"","comm":19,"pr":1.863,"cardList":[["BT10-052","쥬레이몬"],["BT8-054","피스트몬"],["EX3-043","엔트몬"]],"qaList":[],"rules":[["16","키워드 효과"],["16-10","《흡수 진화》"],["4-2","코스트"],["8-1","진화"],["15-5","유발 조건"]]},{"id":"P176","p":176,"size":8,"cards":8,"qa":13,"label":"【등장 시】자신의 덱 위에서부터 3장 오픈한다. 그중 특징으로 「타천사형」/「마왕형」을 가진 카드 1장과 퍼플인 옵션 카드 1장을 패에 추가한다","types":"덱 위 확인 / 덱으로 되돌림 / 파기","sub":"【등장 시】","comm":2,"pr":2.611,"cardList":[["BT15-011","티라노몬"],["BT15-070","피코데블몬"],["BT8-072","피 나요?","네, 가능합니다."],["EX5-043","이 카드의 【진화 시】【메인】 효과의 「이 디지몬의 진화원에 명칭에 「두프트몬」을 포함하는 카드 또는 「X항체」가 있다면, 이 효과의 코스트 경감 수치 -3.」은 어떤 의미인가요?","등장 코스트 -4의 효과를 조건을 만족하고 있는 경우, 추가로 등장 코스트 -3하여 등장 코스트 -7로 패의 그린인 디지몬 카드 1장을 등장시킬 수 있다는 의미입니다."],["BT20-013","배틀 에어리어에 이 카드가 2장 있는 상황입니다. 이 카드 2장의 【메인】효과를 발휘하여 명칭에 「시스터몬」이나 「간쿠몬」을 포함한 카드 1장을 지불하는 등장 코스트를 합계 -4하여 등장시킬 수 있습니까?","아니요, 할 수 없습니다. 등장시키는 효과를 복수 동시에 발휘시킬 수 없습니다."],["BT20-013","이 카드의 【메인】효과로, 「BT20-057 간쿠몬」을 등장시킨 경우, 「BT20-057 간쿠몬」 첫 번째 효과를 발휘하여 지불하는 등장 코스트는 합계 -6됩니까?","네, 지불하는 등장 코스트는 합계 -6됩니다."],["BT20-013","「ST12-03 황금톱니몬」 등의 「지불하는 등장 코스트를 마이너스할 수 없다.」 효과를 가진 디지몬이 배틀 에어리어에 있을 때 이 카드의 【메인】효과를 발휘하여 명칭에 「시스터몬」이나 「간쿠몬」을 포함한 카드 1장을 등장시킬 수 있습니까?","발휘하여 등장시킬 수 있으나, 등장 코스트는 마이너스되지 않습니다."]],"rules":[["4-2","코스트"],["7-1","등장"],["15-9-2","임의 처리"],["15-16-7","【메인】"],["15-14-1","[턴 X회]"]]},{"id":"P209","p":209,"size":7,"cards":7,"qa":2,"label":"【등장 시】상대의 턴 종료까지 자신의 디지몬 1마리는 《길동무》를 얻는다.","types":"키워드 부여","sub":"【등장 시】","comm":16,"pr":1.039,"cardList":[["BT13-079","팔코몬"],["BT20-067","소울몬"],["BT21-075","스컬그레이몬"],["BT23-004","푸치메라몬"],["EX10-048","묘티스몬"],["EX5-059","도베르몬 X항체"],["EX7-054","블랙가트몬"]],"qaList":[["BT13-079","이 카드의 진화원 효과는 이 카드를 진화원으로 가진 디지몬이 배틀한 상대의 디지몬이 가진 《길동무》로 소멸했을 때에도 발휘되나요?","네, 배틀이 아닌 《길동무》의 효과에 의한 소멸이므로 발휘됩니다."],["EX10-048","이 카드의 첫 번째 효과로 【소멸 시】 효과를 가진 디지몬을 소멸시킨 경우, 이 카드의 【등장 시】 효과와 소멸시킨 디지몬의 【소멸 시】 효과 중 어느 쪽을 먼저 발휘하나요?","동시에 유발되므로 턴 플레이어가 어느 쪽을 먼저 발휘할지 선택할 수 있습니다."]],"rules":[["16-13","《길동무》"],["15-13","효과 부여"],["15-15-2","「얻는다・준다」"],["15-16-2","【등장 시】"],["15-16-3","【진화 시】"]]},{"id":"P247","p":247,"size":6,"cards":6,"qa":0,"label":"이 카드가 등장할 때, Lv.3의 자신의 디지몬 1마리를 소멸시키는 것으로, 지불하는 등장 코스트 -4.","types":"소멸 / 유발 · 이 카드 · 등장함 / 코스트 감소","sub":"","comm":0,"pr":0.81,"cardList":[["BT13-080","프로토 기즈몬"],["BT13-083","기즈몬: AT"],["BT13-086","기즈몬: XT"],["BT18-073","파워드라몬"],["EX10-048","묘티스몬"],["EX6-039","크리사리몬"]],"qaList":[],"rules":[["4-15","소멸"],["4-2","코스트"],["15-5","유발 조건"],["15-8-3","유발형 효과"],["7-1","등장"]]},{"id":"P513","p":513,"siz 로 패의 명칭에 「","types":"소멸 / 진화","sub":"【등장 시+진화 시】","comm":6,"pr":1.494,"cardList":[["BT20-011","엑스브이몬"],["BT20-066","스팅몬"],["BT20-076","황제드라몬: 드래곤 모드 ACE"]],"qaList":[["BT20-011","이 카드의 【등장 시】【진화 시】효과를 발휘하여 첫 번째 처리로 상대의 디지몬이 배틀 에어리어를 벗어날 때, 「벗어날 때」등의 다른 즉시형 효과로 이 카드가 배틀 에어리어에서 벗어났습니다. 그 뒤에 이 효과의 「그 후」 이후 효과를 처리할 수 있습니까","네, 가능합니다. 효과를 발휘한 경우, 발휘한 카드가 효과의 도중에 그 장소를 벗어났을 경우에도 마지막까지 해결합니다."]],"rules":[["15-16-2","【등장 시】"],["15-16-3","【진화 시】"],["4-15","소멸"],["8-1","진화"],["15-9-2","임의 처리"]]},{"id":"P554","p":554,"size":3,"cards":3,"qa":3,"label":"【등장 시】【진화 시】「아트＆르네＆포르」(디지몬・화이트・DP 6000・《재기동》","types":"기타(행동 미분류)","sub":"【등장 시+진화 시】","comm":6,"pr":0.478,"cardList":[["BT20-017","제스몬"],["BT23-013","제스몬"],["BT23-057","간쿠몬"]],"qaList":[["BT23-013","이 카드로 어택하여 이 카드의 【진화 시】【어택 시】 효과로 디지몬을 등장시킨 뒤, 등장시킨 그 디지몬을 《연계》로 레스트시킬 수 있나요?","네, 가능합니다."],["BT23-013","이 카드로 어택하여 이 카드의 【진화 시】【어택 시】 효과로 디지몬을 등장시킨 뒤, 이 카드의 【자신의 턴】 효과로 어택할 수 있나요?","아니요, 어택할 수 없습니다. 어택 중에는 새로 어택을 선언할 수 없습니다. 이 상황에서는 이 카드로 어택하고 【진화 시】【어택 시】 효과로 디지몬을 등장시킵니다. 카운터 타이밍이 되기 전에 이 카드의 【자신의 턴】"],["BT23-013","자신의 「BT10-085 시스터몬 시엘」이 있는 상황입니다. 이 카드의 【진화 시】【어택 시】 효과로 「시스터몬 시엘」로도 취급하는 「BT6-084 시스터몬 느와르」나 「ST12-13 시스터몬 느와르」를 등장시킬 수 있나요?","아니요, 등장시킬 수 없습니다. 「같은 명칭」은 같은 명칭을 하나라도 가진 카드를 가리킵니다. 이 효과로 「시스터몬 시엘」과 같은 명칭을 가진 카드는 등장시킬 수 없습니다."]],"rules":[["15-16-3","【진화 시】"],["15-16-2","【등장 시】"],["16-11","《재기동》"],["15-16-5","【어택 시】"],["16-24","《연계》"]]},{"id":"P403","p":403,"size":4,"cards":4,"qa":5,"label":"{시큐리티}【서로의 턴】명칭에 「레나몬」/「구미호몬」/「도사몬」/「샤크라몬」을 포함하는 자신의 디지몬이 배틀 이외로 배틀 에어리어를 벗어날 때,","types":"되돌림·이탈 내성 / 유발 · 자신의 디지몬 · 배틀 에어리어 · 벗어남","sub":"【서로의 턴】","comm":3,"pr":1.941,"cardList":[["BT20-027","슬레이어드라몬"],["BT20-100","최후의 수호자"],["BT23-043","캐논벌몬"],["ST22-10","금강계만다라"]],"qaList":[["BT20-027","이 카드의 진화원 효과는 어떤 카드가 벗어날 때 유발합니까?","『「드라코몬」 기술이 있는 카드』나 『「엑자몬」 기술이 있는 카드』입니다."],["BT20-027","이 카드의 진화원 효과는 어떤 효과입니까?","이 효과로 지정된 디지몬이 지정된 상황에서 벗어날 때 유발하여 발휘할 수 있습니다. 발휘하면 이 효과의 유발 조건이 된 디지몬 전부가 벗어나지 않게 됩니다."],["ST22-10","자신의 시큐리티에 이 카드가 앞면으로 여러 장 놓여 <script>
(function(){
const B=JSON.parse(document.getElementById('data').textContent);
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SLOTS=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const colorOf=k=>k<8?css(SLOTS[k]):css('--other');   // fixed order; communities past 8 fold into "기타"
const KIND_ORDER=['타이밍','행동','키워드','종류','위치'];
let view='A',colorBy='comm',focusComm=null,sel=null,sim=null,LT={e:true,q:true,c:true};

function elemCommNames(){const m={};B.A.nodes.forEach(n=>{(m[n.comm]=m[n.comm]||[]).push(n)});
  return Object.keys(m).sort((a,b)=>a-b).map(k=>m[k].sort((x,y)=>y.count-x.count).slice(0,3).map(n=>n.name).join(' · '))}
const A_NAMES=elemCommNames();

function graphData(){
  if(view==='A')return {nodes:B.A.nodes.map(n=>({...n,r:4+Math.sqrt(n.count)/3.2})),links:B.A.links.map(l=>({...l,source:l.s,target:l.t}))};
  const links=B.B.links.filter(l=>(LT.e&&l.e)||(LT.q&&l.q)||(LT.c&&l.c)).map(l=>({...l,source:l.s,target:l.t}));
  return {nodes:B.B.nodes.map(n=>({...n,name:'#'+n.p,r:3+Math.sqrt(n.size)*1.1})),links};
}
function legend(){
  const names=view==='A'?A_NAMES:B.B.comms;const nodes=view==='A'?B.A.nodes:B.B.nodes;
  const counts={};nodes.forEach(n=>counts[n.comm]=(counts[n.comm]||0)+1);
  const shown=names.slice(0,8).map((nm,k)=>`<button type="button" data-comm="${k}" aria-pressed="${focusComm===k}"><i style="background:${colorOf(k)}"></i>계열 ${k+1}: ${esc(nm)} <span style="color:var(--faint)">${counts[k]||0}</span></button>`).join('');
  const rest=names.length>8?`<button type="button" data-comm="other" aria-pressed="${focusComm==='other'}"><i style="background:${colorOf(99)}"></i>기타 계열 ${names.length-8}개</button>`:'';
  $('legend').innerHTML=`<div style="font-weight:700;color:var(--muted)">효과 계열 (커뮤니티) · 누르면 강조</div>${shown}${rest}`;
}
const svg=d3.select('#svg');const gRoot=svg.append('g');const gL=gRoot.append('g');const gN=gRoot.append('g');const gT=gRoot.append('g');
svg.call(d3.zoom().scaleExtent([0.2,6]).on('zoom',e=>gRoot.attr('transform',e.transform)));
let NODES=[],LINKS=[],adj=new Map();
function draw(){
  if(sim)sim.stop();
  const {nodes,links}=graphData();NODES=nodes;LINKS=links;
  adj=new Map(nodes.map(n=>[n.id,new Map()]));links.forEach(l=>{adj.get(l.source).set(l.target,l);adj.get(l.target).set(l.source,l)});
  const W=$('stage').clientWidth,H=$('stage').clientHeight;
  const maxW=d3.max(links,l=>l.w)||1;
  const ln=gL.selectAll('line').data(links).join('line').attr('stroke',css('--link')).attr('stroke-width',l=>view==='A'?0.6+2.4*Math.sqrt(l.w/maxW):0.6+1.6*(l.w/maxW)).attr('stroke-opacity',0.55);
  const nd=gN.selectAll('circle').data(nodes,d=>d.id).join('circle').attr('r',d=>d.r).attr('fill',d=>colorOf(d.comm)).attr('stroke',css('--surface')).attr('stroke-width',1.5).style('cursor','pointer')
    .on('mouseenter',(e,d)=>tip(e,d)).on('mousemove',(e,d)=>tip(e,d)).on('mouseleave',()=>{$('tip').style.opacity=0})
    .on('click',(e,d)=>{select(d.id)}).call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.2).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
  // labels: every node in the element map; only the largest patterns in the pattern map
  const labelled=view==='A'?nodes:nodes.slice().sort((a,b)=>b.size-a.size).slice(0,28);
  const tx=gT.selectAll('text').data(labelled,d=>d.id).join('text').text(d=>view==='A'?d.name:(d.types.split(' / ')[0]+(d.sub?' '+d.sub:'')).slice(0,22))
    .attr('font-size',view==='A'?11:10).attr('fill',css('--ink')).attr('paint-order','stroke').attr('stroke',css('--surface')).attr('stroke-width',3).attr('pointer-events','none').attr('text-anchor','middle');
  sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(view==='A'?70:28).strength(l=>view==='A'?Math.min(1,0.15+l.pmi/4):0.35))
    .force('charge',d3.forceManyBody().strength(view==='A'?-160:-22)).force('center',d3.forceCenter(W/2,H/2)).force('collide',d3.forceCollide(d=>d.r+2))
    .force('x',d3.forceX(W/2).strength(0.04)).force('y',d3.forceY(H/2).strength(0.05))
    .on('tick',()=>{ln.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);nd.attr('cx',d=>d.x).attr('cy',d=>d.y);tx.attr('x',d=>d.x).attr('y',d=>d.y-d.r-3)});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){sim.stop();for(let i=0;i<300;i++)sim.tick();sim.on('tick')()}
  legend();emphasize();
  $('nodelist').innerHTML=nodes.map(n=>`<option value="${esc(view==='A'?n.name:'#'+n.p+' '+n.types)}"></option>`).join('');
  panel();
}
function tip(e,d){const t=$('tip');const r=$('stage').getBoundingClientRect();
  t.innerHTML=view==='A'?`<b>${esc(d.name)}</b> · ${esc(d.kind)}<br>효과 ${d.count.toLocaleString()}개 · 연결 ${adj.get(d.id).size}`:`<b>패턴 #${d.p}</b> ${esc(d.types)} ${esc(d.sub)}<br>효과 ${d.size} · 카드 ${d.cards} · Q&amp;A ${d.qa}<br><span style="opacity:.8">${esc(d.label)}</span>`;
  t.style.left=Math.min(e.clientX-r.left+12,r.width-310)+'px';t.style.top=(e.clientY-r.top+12)+'px';t.style.opacity=1}
function emphasize(){
  const nb=sel?new Set([sel,...adj.get(sel).keys()]):null;
  const inComm=d=>focusComm==null||(focusComm==='other'?d.comm>=8:d.comm===focusComm);
  gN.selectAll('circle').attr('opacity',d=>(nb?nb.has(d.id):inComm(d))?1:0.12).attr('stroke',d=>d.id===sel?css('--ink'):css('--surface')).attr('stroke-width',d=>d.id===sel?2.5:1.5);
  gL.selectAll('line').attr('stroke-opacity',l=>nb?((l.source.id===sel||l.target.id===sel)?0.9:0.04):(focusComm==null?0.55:(inComm(l.source)&&inComm(l.target)?0.6:0.05)))
    .attr('stroke',l=>nb&&(l.source.id===sel||l.target.id===sel)?css('--accent'):css('--link'));
  gT.selectAll('text').attr('opacity',d=>(nb?nb.has(d.id):inComm(d))?1:0.15);
}
function select(id){sel=id;emphasize();panel()}
function panel(){
  const p=$('panel');
  if(!sel){
    const nodes=view==='A'?B.A.nodes:B.B.nodes;const links=view==='A'?B.A.links:B.B.links;
    const top=view==='A'?nodes.slice().sort((a,b)=>b.btw-a.btw).slice(0,8):nodes.slice().sort((a,b)=>b.pr-a.pr).slice(0,8);
    p.innerHTML=`<h2>${view==='A'?'효과 요소 네트워크':'효과 패턴 네트워크'}</h2>
      <div class="k">${view==='A'?'노드 = 타이밍·행동·키워드·효과 종류. 링크 = 한 효과 안에서 우연보다 자주 함께 쓰임(PMI>0, 5회 이상). 굵을수록 자주 함께 나옵니다.':'노드 = 효과 패턴(효과 3개 이상). 링크 = 요소가 닮음 · 같은 Q&amp;A 쟁점을 공유 · 같은 카드에 함께 수록(3장 이상). 위 체크로 링크 종류를 고를 수 있습니다.'}</div>
      <div class="stats"><div><b>${nodes.length}</b><span>노드</span></div><div><b>${links.length.toLocaleString()}</b><span>링크</span></div><div><b>${(view==='A'?A_NAMES:B.B.comms).length}</b><span>효과 계열</span></div></div>
      <div class="k">${view==='A'?'다리 역할이 큰 요소 (매개 중심성)':'중심에 있는 패턴 (PageRank)'}</div>
      <div class="lst">${top.map(n=>`<button type="button" data-go="${esc(n.id)}">${view==='A'?esc(n.name)+` <span class="w">${n.kind}</span>`:'#'+n.p+' '+esc(n.types)+' '+esc(n.sub)}<span class="w">${view==='A'?n.btw.toFixed(2):n.pr.toFixed(1)}</span></button>`).join('')}</div>
      <details class="tbl"><summary>표로 보기 (전체 노드)</summary>${table()}</details>`;
    return}
  const d=NODES.find(n=>n.id===sel);const nb=[...adj.get(sel).entries()].map(([k,l])=>({n:NODES.find(x=>x.id===k),l})).sort((a,b)=>b.l.w-a.l.w);
  if(view==='A'){
    p.innerHTML=`<div class="k">${esc(d.kind)} · 계열 ${d.comm+1}</div><h2>${esc(d.name)}</h2>
      <div class="stats"><div><b>${d.count.toLocaleString()}</b><span>효과</span></div><div><b>${nb.length}</b><span>연결</span></div><div><b>${d.btw.toFixed(2)}</b><span>매개 중심성</span></div></div>
      <div class="k">함께 쓰이는 요소 (공동 출현 수 · PMI)</div>
      <div class="lst">${nb.map(x=>`<button type="button" data-go="${esc(x.n.id)}">${esc(x.n.name)} <span class="w">${x.n.kind} · ${x.l.w}회 · PMI ${x.l.pmi}</span></button>`).join('')}</div>
      <button type="button" class="lst" style="border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start" data-go="">선택 해제</button>`;
  }else{
    const why=l=>[l.e?`요소 닮음 ${Math.round(l.e*100)}%`:'',l.q?`Q&A 쟁점 ${l.q}개 공유`:'',l.c?`같은 카드 ${l.c}장`:''].filter(Boolean).join(' · ');
    p.innerHTML=`<div class="k">패턴 #${d.p} · 계열 ${d.comm+1}: ${esc(B.B.comms[d.comm]||'')}</div><h2>${esc(d.types)} ${esc(d.sub)}</h2>
      <div style="font-size:13.5px;background:var(--bg);border-radius:8px;padding:8px 10px">${esc(d.label)}</div>
      <div class="stats"><div><b>${d.size}</b><span>효과</span></div><div><b>${d.cards}</b><span>카드</span></div><div><b>${d.qa}</b><span>Q&amp;A</span></div></div>
      <div class="k">연결된 패턴 (${nb.length})</div>
      <div class="lst">${nb.slice(0,14).map(x=>`<button type="button" data-go="${esc(x.n.id)}">#${x.n.p} ${esc(x.n.types)} ${esc(x.n.sub)}<span class="w">${why(x.l)}</span></button>`).join('')||'<div class="empty">현재 링크 조건에서 연결 없음</div>'}</div>
      <div class="k">이 패턴의 Q&amp;A</div>
      ${d.qaList.length?d.qaList.map(q=>`<div class="qa"><div><b>Q</b> ${esc(q[1])}</div><div><b>A</b> ${esc(q[2])}</div><div style="font-size:11.5px;color:var(--muted)">${esc(q[0])}</div></div>`).join(''):'<div class="empty">연결된 Q&amp;A 없음</div>'}
      <div class="k">관련 종합 룰 조항</div><div class="lst">${d.rules.map(r=>`<div>${esc(r[0])} ${esc(r[1])}</div>`).join('')}</div>
      <div class="k">카드 (${d.cards})</div><div class="cards">${d.cardList.map(c=>`<span><em>${esc(c[0])}</em>${esc(c[1])}</span>`).join('')}</div>
      <button type="button" style="border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start" data-go="">선택 해제</button>`;
  }
}
function table(){const nodes=(view==='A'?B.A.nodes:B.B.nodes).slice().sort((a,b)=>view==='A'?b.count-a.count:b.size-a.size);
  return view==='A'?`<table><tr><th>요소</th><th>종류</th><th>효과</th><th>계열</th></tr>${nodes.map(n=>`<tr><td>${esc(n.name)}</td><td>${n.kind}</td><td class="n">${n.count}</td><td class="n">${n.comm+1}</td></tr>`).join('')}</table>`
  :`<table><tr><th>패턴</th><th>유형</th><th>효과</th><th>카드</th><th>Q&amp;A</th><th>계열</th></tr>${nodes.map(n=>`<tr><td>#${n.p}</td><td>${esc(n.types)} ${esc(n.sub)}</td><td class="n">${n.size}</td><td class="n">${n.cards}</td><td class="n">${n.qa}</td><td class="n">${n.comm+1}</td></tr>`).join('')}</table>`}

document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b===v));$('btog').hidden=view!=='B';sel=null;focusComm=null;draw();return}
  const c=e.target.closest('[data-comm]');if(c){const k=c.dataset.comm==='other'?'other':+c.dataset.comm;focusComm=focusComm===k?null:k;sel=null;legend();emphasize();panel();return}
  const g=e.target.closest('[data-go]');if(g){select(g.dataset.go||null);return}
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-lt]');if(t){LT[t.dataset.lt]=t.checked;sel=null;draw()}});
$('find').addEventListener('change',()=>{const v=$('find').value.trim();if(!v)return;
  const n=NODES.find(n=>view==='A'?n.name===v:('#'+n.p+' '+n.types)===v)||NODES.find(n=>(view==='A'?n.name:'#'+n.p+' '+n.types+' '+n.label).includes(v));
  if(n){select(n.id)}});
svg.on('click',e=>{if(e.target.tagName==='svg'){sel=null;emphasize();panel()}});
window.addEventListener('resize',()=>{if(sim){sim.force('center',d3.forceCenter($('stage').clientWidth/2,$('stage').clientHeight/2)).alpha(0.3).restart()}});
draw();
})();
</script>
