<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>디지몬 카드 판정 도우미</title>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--muted:#5d6470;--card:#fff;--line:#dfe3e8;--accent:#2457d6}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#eceef1;--muted:#9aa2ad;--card:#1b1e22;--line:#2c3138;--accent:#6f97ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:560px;margin:12vh auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:20px;margin:0 0 6px}p{margin:6px 0;color:var(--muted)}a.btn{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none}
</style></head>
<body><main><div class="card">
<h1>디지몬 카드 판정 도우미</h1>
<p id="msg">판정 도우미 서버로 이동하고 있습니다…</p>
<a class="btn" id="go" href="#" hidden>서버로 이동</a>
<p style="font-size:13px;margin-top:14px">공식 Q&amp;A·종합 룰·심판이 확인한 판정으로만 답합니다(AI 판정 없음). 비공식 도구이며 최종 판정은 대회 심판에게 확인하세요.</p>
</div></main>
<script>
// The server's public address changes when its tunnel restarts; url.json is kept current by the server PC (server/watch_tunnel.ps1).
(async()=>{const msg=document.getElementById('msg'),go=document.getElementById('go');
  try{const j=await (await fetch('url.json?t='+Date.now(),{cache:'no-store'})).json();const u=j.url;
    go.href=u;go.hidden=false;
    let up=false;try{const h=await fetch(u+'/health',{cache:'no-store'});up=h.ok}catch(e){}
    if(up){msg.textContent='서버에 연결됐습니다. 이동합니다…';location.replace(u)}
    else{msg.textContent='서버가 지금 응답하지 않습니다(서버 PC가 꺼져 있거나 주소를 바꾸는 중일 수 있습니다). 잠시 뒤 다시 열어 주세요. 마지막으로 알려진 주소: '+u+' ('+(j.updated||'')+')'}
  }catch(e){msg.textContent='서버 주소를 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.'}})();
</script></body></html>
