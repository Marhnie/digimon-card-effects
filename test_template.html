<title>카드 효과 근거 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Do+Hyeon&display=swap">
<style>
/* Layout: sticky query bar; results are a stack of effect-unit panels, each with its evidence sections */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202c; --muted:#5d6878; --line:#d9dee6;
  --accent:#e2560f; --accent-soft:#fde7d9; --link:#1f5fbf; --chip:#eef1f6; --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6700; --warn-soft:#fff3d6;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#161d27; --ink:#e3e8ef; --muted:#93a0b2; --line:#29323f;
  --accent:#ff7a3a; --accent-soft:#3a2216; --link:#7fb0ff; --chip:#1f2833; --ok:#5fd39a; --ok-soft:#14301f; --warn:#f2c14e; --warn-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --ink:#e3e8ef; --muted:#93a0b2; --line:#29323f;
  --accent:#ff7a3a; --accent-soft:#3a2216; --link:#7fb0ff; --chip:#1f2833; --ok:#5fd39a; --ok-soft:#14301f; --warn:#f2c14e; --warn-soft:#3a2f12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 12px;display:grid;gap:10px}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0}
h1 b{color:var(--accent);font-weight:400}
.sub{color:var(--muted);font-size:13px}
.qrow{display:flex;gap:8px;align-items:stretch}
.qrow textarea{flex:1;min-width:0;font:inherit;font-size:15.5px;line-height:1.5;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;min-height:44px;height:44px;outline:none}
.qrow textarea:focus{border-color:var(--accent)}
.acwrap{position:relative;flex:1;min-width:0;display:flex}
.acwrap textarea{flex:1}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:min(360px,60vh);overflow-y:auto;margin:0;padding:4px;list-style:none}
.ac li{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:6px;cursor:pointer;min-width:0}
.ac li .cno{font-family:var(--f-num);font-size:13px;color:var(--accent);flex:none;min-width:6.5em}
.ac li .cnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ac li .cty{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.ac li[aria-selected="true"],.ac li:hover{background:var(--accent-soft)}
.ac li mark{background:none;color:var(--accent);font-weight:700}
.ac .hint{font-size:12px;color:var(--muted);padding:4px 10px;cursor:default}
.ac .hint:hover{background:none}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:0 18px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff}
.btn:focus-visible,.chip:focus-visible,.ex:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.exs{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.ex{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.ex:hover{border-color:var(--accent);color:var(--accent)}
main .wrap{padding-block:18px 60px;display:grid;gap:16px}
.cardhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cardhead h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.cardhead .no{font-family:var(--f-num);color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.uhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;background:var(--chip);color:var(--ink);border-radius:6px;padding:1px 8px;border:0;font-family:inherit}
.chip.k{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip.t{font-weight:500}
.chip.p{background:transparent;border:1px solid var(--line);cursor:pointer}
.chip.p:hover{border-color:var(--accent)}
.utext{font-size:15.5px;overflow-wrap:anywhere}
.ntext{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ntext b{font-weight:500}
details.sec{border-top:1px solid var(--line);padding-top:8px}
details.sec>summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;gap:8px;align-items:baseline}
details.sec>summary::-webkit-details-marker{display:none}

details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary .n{font-family:var(--f-num);font-size:12.5px;color:var(--accent)}

.list{display:grid;gap:8px;margin-top:8px}
.qa{display:grid;gap:3px;padding:8px 10px;border-radius:8px;background:var(--bg);min-width:0}
.qa .src{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.qa .src button{font:inherit;font-size:12px;color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.qa .q,.qa .a{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:4px;overflow-wrap:anywhere}
.qa .q b{color:var(--accent);font-family:var(--f-num);font-size:13px}
.qa .a b{color:var(--link);font-family:var(--f-num);font-size:13px}
.qa .q{font-weight:500}
.qa .ctx{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.rule{padding:8px 10px;border-radius:8px;background:var(--bg);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;min-width:0}
.rule .rn{font-family:var(--f-num);color:var(--accent);font-size:13px;padding-top:1px}
.rule .rt{overflow-wrap:anywhere}
.rule .kids{grid-column:2;font-size:13.5px;color:var(--muted);display:grid;gap:2px}
.tag-est{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px}
.more{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer;justify-self:start}
.cards{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cards button{font:inherit;font-family:var(--f-num);font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:1px 7px;cursor:pointer}
.cards button:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.pick{display:grid;gap:6px}
.pick button{text-align:left;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);cursor:pointer}
.pick button:hover{border-color:var(--accent)}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.chip.ask{background:var(--accent);color:#fff;border:0;cursor:pointer;font-weight:700}
.askp{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px 16px;display:grid;gap:12px;min-width:0;scroll-margin-top:170px}
.askp h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.askp h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.askp .eff{font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.askp textarea{width:100%;font:inherit;font-size:15px;line-height:1.55;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:70px;resize:vertical}
.askp textarea:focus{outline:none;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;align-items:start}
.frow>b{font-size:13px;padding-top:4px}
.frow select{font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.sl{display:flex;flex-wrap:wrap;gap:5px}
.sl button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:1px 9px;cursor:pointer}
.sl button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.verdict{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.verdict.sure{background:var(--ok-soft)}.verdict.ref{background:var(--warn-soft)}.verdict.none,.verdict.ai{background:var(--bg)}
.verdict .big{font-family:var(--f-display);font-size:26px;line-height:1.2}
.verdict .lvl{font-size:12.5px;font-weight:700}
.verdict.sure .lvl{color:var(--ok)}.verdict.ref .lvl{color:var(--warn)}
.verdict ul{margin:0;padding-left:20px}
.cite{font:inherit;font-family:var(--f-num);font-size:11.5px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:4px;padding:0 5px;margin:0 2px;cursor:pointer}
.ev[hidden]{display:none}
.frm-note{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.frow{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){h1{font-size:22px}.qrow{flex-direction:column}.btn{padding:8px 18px}}
@media (prefers-reduced-motion:reduce){details.sec>summary::before{transition:none}}
</style>

<header class="top">
  <div class="wrap">
    <div><h1>카드 효과 <b>근거 찾기</b></h1><div class="sub">카드 효과를 효과 단위로 나누고, 같은 유형·패턴의 Q&amp;A와 종합 룰 조항을 근거로 모읍니다 · 분류 v2 테스트</div></div>
    <div class="qrow">
      <div class="acwrap"><textarea id="q" rows="1" placeholder="카드 번호나 이름을 입력하면 후보가 뜹니다 (예: BT14-033, 파닥몬) · 효과 문구를 붙여 넣어도 됩니다" aria-label="카드 검색 또는 효과 문구" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ac" autocomplete="off"></textarea>
      <ul class="ac" id="ac" role="listbox" hidden></ul></div>
      <button class="btn" id="go" type="button">찾기</button>
    </div>
    <div class="exs" id="exs">예시:</div>
  </div>
</header>
<main><div class="wrap" id="out"></div></main>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const out=$('out');
const CFG=D.cfg;
const RULE_KEYS=Object.keys(D.rules);

// unit row: [card, where, kind, text, ntext|0, timing[], limit[], keywords[], types[], forms[], pattern, rules[], qa[], tpl]
const U=D.units.map((r,i)=>({i,card:r[0],where:r[1],kind:r[2],text:r[3],ntext:r[4]||r[3],timing:r[5],limit:r[6],kw:r[7],types:r[8],forms:r[9],p:r[10],rules:r[11],qa:r[12],tpl:r[13]}));
const QA=D.qa.map((r,i)=>({i,card:r[0],q:r[1],a:r[2],unit:r[3],rule:r[4],how:r[5],it:r[6],sl:r[7],slk:r[7].join(','),y:r[8],neg:r[9],g:r[10]}));
const byCard={},byPat={};
U.forEach(u=>{(byCard[u.card]=byCard[u.card]||[]).push(u);(byPat[u.p]=byPat[u.p]||[]).push(u)});
const cardQA={};QA.forEach(q=>{if(q.card)(cardQA[q.card]=cardQA[q.card]||[]).push(q)});
const genByRule={};QA.forEach(q=>{if(q.rule&&q.unit<0)(genByRule[q.rule]=genByRule[q.rule]||[]).push(q)});
const cname=no=>(D.cards[no]||[''])[0];

/* ---------- pasted-text analysis: same rules as the card-list pipeline ---------- */
const LIM='(?:\\[[^\\]\\n]{1,8}\\]|\\{[^}\\n]{1,4}\\}|〔턴[^〕]{0,6}〕)';
const TIMING_RUN=new RegExp('(?:'+LIM+'\\s*)*(?:【[^】]{1,20}】\\s*)+(?:'+LIM+'\\s*)*','g');
const TIMING_RUN1=new RegExp('^(?:'+LIM+'\\s*)*(?:【[^】]{1,20}】\\s*)+(?:'+LIM+'\\s*)*');
const WORDING=CFG.wording.map(([a,b])=>[new RegExp(a,'g'),b]);
const ACTS=CFG.actions.map(([n,p])=>[n,new RegExp(p)]);
const FORMS=CFG.forms.map(([n,p])=>[n,new RegExp(p)]);
const normText=s=>{s=s.replace(/≪/g,'《').replace(/≫/g,'》').replace(/｛/g,'{').replace(/｝/g,'}').replace(/\s+/g,' ').trim();return /^[-ー－]$/.test(s)?'':s};
const normWording=s=>{for(const [a,b] of WORDING)s=s.replace(a,b);return s};
function quoteDepth(s){let d=0;const o=[];for(const ch of s){if(ch==='「')d++;o.push(d);if(ch==='」')d=Math.max(0,d-1)}return o}
function unitStarts(s){
  const chars=[...s];const depth=quoteDepth(s);const st=new Set([0]);
  // work on UTF-16 indices: build map from code-unit index to char index
  const idx=[];let k=0;for(const ch of chars){idx.push(k);k+=ch.length}
  const di=i=>{let lo=0,hi=idx.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(idx[m]<=i)lo=m;else hi=m-1}return depth[lo]};
  const prevCh=i=>{const t=s.slice(0,i).trimEnd();return t?t.slice(-1):''};
  TIMING_RUN.lastIndex=0;let m;
  while((m=TIMING_RUN.exec(s))){const i=m.index;if(m[0].length===0){TIMING_RUN.lastIndex++;continue}
    if(di(i)>0)continue;const p=prevCh(i);
    if('.。)）》〉」:'.includes(p)||p===''||/코스트\s*\d+\s*$/.test(s.slice(0,i))||/\d\)$/.test(s.slice(0,i).trimEnd()))st.add(i)}
  const re2=/〔(?!턴)[^〕]+〕|〈(?:룰|링크)〉|디지크로스\s*-\s*\d|어셈블리\s*-\s*\d/g;
  while((m=re2.exec(s)))if(di(m.index)===0)st.add(m.index);
  const re3=/《/g;
  while((m=re3.exec(s))){const i=m.index;if(di(i)>0)continue;const p=prevCh(i);
    if(['','.',')','）','》'].includes(p)&&!/[가-힣]\s*$/.test(s.slice(0,i)))st.add(i)}
  return [...st].sort((a,b)=>a-b);
}
function splitUnits(s){if(!s)return[];const st=unitStarts(s).concat([s.length]);const out=[];
  for(let j=0;j<st.length-1;j++){const p=s.slice(st[j],st[j+1]).trim();if(!p)continue;
    if(out.length&&(p.startsWith('《덱》')||/^《[^》]*》》/.test(p)))out[out.length-1]+=' '+p;else out.push(p)}
  return out}
function headKind(u){
  let m=u.match(/^〔(진화|조그레스|어플 합체|버스트 진화)〕/);if(m)return '특수 진화 조건:'+m[1];
  if(u.startsWith('〈룰〉'))return '카드 고유 룰';if(u.startsWith('〈링크'))return '링크';
  if(/^디지크로스\s*-/.test(u))return '디지크로스';if(/^어셈블리\s*-/.test(u))return '어셈블리';
  if(new RegExp('^(?:'+LIM+'\\s*)*【').test(u))return '타이밍 효과';if(u.startsWith('《'))return '키워드 능력';return '상시·기타 문장'}
function keywords(u){const ks=[];const re=/《\s*([^《》\d+\-]+?)\s*(?:[+\-]?\s*\d+)?\s*(?:《[^》]*》)?\s*》/g;let m;
  while((m=re.exec(u))){let k=m[1].replace(/\s+/g,' ').trim();k={'시큐리티 어택':'S 어택','S어택':'S 어택','블록커':'블로커','흡수진화':'흡수 진화'}[k]||k;ks.push(k)}return [...new Set(ks)].sort()}
function template(u){let t=u;for(let i=0;i<3;i++)t=t.replace(/「[^「」]*」/g,'「X」');return t.replace(/\d+/g,'N').replace(/레드|블루|옐로|그린|블랙|퍼플|화이트/g,'色').replace(/\([^()]*\)/g,'').replace(/\s+/g,' ').trim()}
function rulesFor(kind,where,timing,kw,acts,forms){
  const o=[];const add=a=>{for(const x of a||[])if(x&&!o.includes(x))o.push(x)};
  add(CFG.kindRule[kind]);add(CFG.whereRule[where]);timing.forEach(t=>add([CFG.timingRule[t]]));kw.forEach(k=>add([CFG.kwRule[k]]));
  acts.forEach(a=>add(CFG.actRule[a]));forms.forEach(f=>add(CFG.formRule[f]));return o}
// nearest card-list unit by idf-weighted bigram overlap of the wording template
let IDX=null;
const bg=s=>{const t=s.replace(/\s+/g,'');const o=new Set();for(let i=0;i<t.length-1;i++)o.add(t.slice(i,i+2));return o};
function buildIdx(){const post=new Map();U.forEach((u,k)=>{u.bg=bg(u.tpl);for(const g of u.bg){let a=post.get(g);if(!a)post.set(g,a=[]);a.push(k)}});
  const idf=new Map();for(const [g,a] of post)idf.set(g,Math.log(1+U.length/a.length));IDX={post,idf};
  U.forEach(u=>{let n=0;for(const g of u.bg)n+=IDX.idf.get(g)**2;u.norm=Math.sqrt(n)||1})}
function nearest(tpl,kind){if(!IDX)buildIdx();const q=bg(tpl);let qn=0;for(const g of q)qn+=(IDX.idf.get(g)||0)**2;qn=Math.sqrt(qn)||1;
  const sc=new Map();for(const g of q){const a=IDX.post.get(g);if(!a)continue;const w=IDX.idf.get(g)**2;for(const k of a)sc.set(k,(sc.get(k)||0)+w)}
  let best=null,bs=0;for(const [k,v] of sc){const s=v/(qn*U[k].norm)*(U[k].kind===kind?1:0.8);if(s>bs){bs=s;best=k}}return best==null?null:{u:U[best],sim:bs}}
function analyseText(txt){
  return splitUnits(normText(txt)).map(u0=>{
    const u=normWording(u0);const m=u.match(TIMING_RUN1);const run=m?m[0]:'';
    const timing=[...run.matchAll(/【([^】]+)】/g)].map(x=>x[1].trim());
    const limit=[...run.matchAll(new RegExp(LIM,'g'))].map(x=>x[0].replace(/[\[\]{}〔〕]/g,''));
    const body=timing.length?u.replace(TIMING_RUN1,''):u;const kind=headKind(u);const kw=keywords(u);
    const acts0=ACTS.filter(([n,p])=>p.test(body)).map(x=>x[0]);const acts=acts0.filter(a=>a!=='코스트 무료');const acts1=acts.length?acts:acts0;
    const forms=FORMS.filter(([n,p])=>p.test(u)).map(x=>x[0]);
    const types=kind==='타이밍 효과'?(acts1.length?acts1:['기타(행동 미분류)']):kind==='키워드 능력'?(kw.length?kw.map(k=>'키워드 · 《'+k+'》'):['키워드 · ?']):[kind];
    const tpl=template(u);const nn=nearest(tpl,kind);
    return {pasted:true,card:'',where:'',kind,text:u0,ntext:u,timing,limit,kw,types,forms,p:nn&&nn.sim>0.55?nn.u.p:null,near:nn,rules:rulesFor(kind,'',timing,kw,acts1,forms),qa:[],tpl};
  })}

/* ---------- rendering ---------- */

const INT_SHOW=['가능 여부','유발·발휘 여부','대상 선택 가능','포함·해당 여부','지속·종료','횟수 제한','처리 순서','결과(어떻게 되나)','수치 결과','정의·의미','여부(그 밖)','기타'];
const intentOf=q=>{for(let k=0;k<INT.length;k++)if(INT[k].re&&INT[k].re.test(q))return k;return INT.length-1};
const slotsOf=q=>SLOT.filter(s=>s.re.test(q)).map(s=>s.i);

const NEGI=SLOT.findIndex(s=>s.g==='부정');
const simQ=(a,b)=>{const A=bg(a),B=bg(b);let x=0;for(const g of A)if(B.has(g))x++;return x/((A.size+B.size-x)||1)};
function precedents(){
  const u=ASK.u;const key=[...ASK.sl].sort((a,b)=>a-b).join(',');const myneg=ASK.sl.has(NEGI)?1:0;
  const pool=QA.filter(q=>q.y>=0&&q.it===ASK.it&&q.slk===key);
  const tierOf=q=>{const v=q.unit>=0?U[q.unit]:null;if(!v||u.p==null)return 2;if(v.p===u.p)return 0;if(v.types.some(t=>u.types.includes(t)))return 1;return 2};
  const combo=comboQA();
  for(let t=0;t<3;t++){
    const c=pool.filter(q=>tierOf(q)===t);if(!c.length)continue;
    let yes=0,no=0;const list=c.map(q=>{const w=0.05+(ASK.q?simQ(ASK.q,q.q):0.5);const y=q.y^(q.neg^myneg);if(y)yes+=w;else no+=w;return {q,w,y}}).sort((a,b)=>b.w-a.w);
    const ans=yes>=no?1:0;const unanimous=list.every(x=>x.y===ans);
    return {tier:t,ans,unanimous,list,combo,level:(t===0&&unanimous&&!ASK.extra.length)?'sure':'ref'};
  }
  return {tier:-1,level:'none',list:[],combo};
}
// several cards: the involved cards, and existing Q&A whose question names another involved card

function comboQA(){const cs=involved();if(cs.length<2)return [];

    const m=names.filter(x=>x.c!==q.card&&(q.q.includes(x.nm)||q.q.includes(x.c)));
    if((own&&m.length)||m.length>=2)hits.push({q,s:simQ(ASK.q||'',q.q)+m.length})}
  return hits.sort((a,b)=>b.s-a.s).slice(0,10).map(x=>x.q)}

  Object.entries(D.rules).forEach(([n,t])=>items.push({id:'R'+n,text:t,label:'종합 룰 '+n,bg:bg(t)}));
  const post=new Map();items.forEach((it,k)=>{for(const g of it.bg){let a=post.get(g);if(!a)post.set(g,a=[]);a.push(k)}});
  const idf=new Map();for(const [g,a] of post)idf.set(g,Math.log(1+items.length/a.length));QIDX={items,post,idf,byId:Object.fromEntries(items.map(it=>[it.id,it]))}}
function retrieveEv(query,card,limit){if(!QIDX)buildQIdx();const sc=new Map();const N=QIDX.items.length;
  for(const g of bg(query)){const a=QIDX.post.get(g);if(!a||a.length>N*0.25)continue;const w=QIDX.idf.get(g);for(const k of a)sc.set(k,(sc.get(k)||0)+w)}
  QIDX.items.forEach((it,k)=>{if(card&&it.card===card)sc.set(k,(sc.get(k)||0)+40);if(it.id[0]==='R'&&it.text.length<25&&sc.has(k))sc.set(k,sc.get(k)*0.55)});
  return [...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k])=>QIDX.items[k])}
function evidenceFor(){const u=ASK.u;const out=[],seen=new Set();const add=it=>{if(it&&!seen.has(it.id)){seen.add(it.id);out.push(it)}};
  if(!QIDX)buildQIdx();
  retrieveEv((u.card||'')+' '+ASK.q,u.card,20).forEach(add);
  if(u.p!=null)(byPat[u.p]||[]).filter(x=>x.card!==u.card).flatMap(x=>x.qa).map(i=>({i,s:simQ(ASK.q,QA[i].q)})).sort((a,b)=>b.s-a.s).slice(0,6).forEach(x=>add(QIDX.byId['Q'+x.i]));
  u.rules.slice(0,6).forEach(n=>add(QIDX.byId['R'+n]));
  (ASK.res&&ASK.res.list||[]).slice(0,4).forEach(x=>add(QIDX.byId['Q'+x.q.i]));
  for(const x of ASK.extra){
    const us=x.unit>=0?[U[x.unit]]:(byCard[x.card]||[]);
    retrieveEv(x.card+' '+cname(x.card)+' '+ASK.q,x.card,6).forEach(add);
    us.forEach(v=>{if(v.p!=null)(byPat[v.p]||[]).filter(y=>y.card!==x.card).flatMap(y=>y.qa).map(i=>({i,s:simQ(ASK.q,QA[i].q)})).sort((a,b)=>b.s-a.s).slice(0,2).forEach(z=>add(QIDX.byId['Q'+z.i]));v.rules.slice(0,3).forEach(n=>add(QIDX.byId['R'+n]))});
  }
  (ASK.res&&ASK.res.combo||comboQA()).slice(0,6).forEach(q=>add(QIDX.byId['Q'+q.i]));
  return out.slice(0,ASK.extra.length?48:34)}
let sampleP=null;const getSample=()=>sampleP||(sampleP=(window.claude&&window.claude.use)?window.claude.use('sample'):Promise.resolve(null));
async function askClaude(){
  if(ASK.busy)return;const u=ASK.u;
  if(!ASK.q.trim()){ASK.ai={err:'질문 문장을 적어야 Claude가 판정할 수 있습니다.'};renderAsk();return}
  ASK.busy=true;ASK.ai={wait:true};renderAsk();
  const sample=await getSample();
  if(!sample){ASK.busy=false;ASK.ai={err:'이 화면에서는 Claude를 부를 수 없습니다. claude.ai에서 이 페이지를 열어 주세요.'};renderAsk();return}
  const ev=evidenceFor();ASK.ai.ev=ev;
  const cardText=u.card?(byCard[u.card]||[]).map(x=>x.text).join('\n'):u.text;
  const prompt=`당신은 디지몬 카드게임(한국어판) 룰 판정 보조입니다. 아래 상황에 대해 [자료]의 공식 Q&A와 종합 룰 Ver.4.3만 근거로 판정하세요. 자료에 없는 룰을 지어내지 말고, 근거가 부족하면 "판단 불가"로 하고 무엇이 더 필요한지 쓰세요.
[카드] ${u.card||'(붙여 넣은 효과)'} ${u.card?cname(u.card):''}
[카드 텍스트]
${cardText}
[질문 대상 효과] ${u.text}${ASK.extra.map(x=>`
[함께 관련된 카드] ${x.card} ${cname(x.card)}
  카드 텍스트: ${(byCard[x.card]||[]).map(v=>v.text).join(' / ')}${x.unit>=0?`
  관련 효과: ${U[x.unit].text}`:''}`).join('')}
[묻는 것] ${INT[ASK.it].n}
[상황 항목] ${[...ASK.sl].map(i=>SLOT[i].g+':'+SLOT[i].n).join(', ')||'없음'}
[질문] ${ASK.q}
[자료]
${ev.map(it=>`[${it.id}] (${it.label}) ${it.text}`).join('\n\n')}

JSON 하나로만 답하세요: {"verdict":"네" | "아니요" | "조건부" | "판단 불가","summary":"한두 문장 결론","reasons":[{"text":"처리 순서대로 한 단계","cite":["Q123","R4-15"]}],"caution":"판단이 갈릴 수 있는 점(없으면 빈 문자열)"}
cite에는 [자료]에 실제로 있는 ID만 쓰세요.`;
  ASK.ctl=new AbortController();
  try{const r=await sample.json(prompt,{modelTier:'complex',signal:ASK.ctl.signal});ASK.ai={r,ev}}
  catch(e){const m={not_granted:'Claude 사용이 허락되지 않았습니다.',rate_limited:'요청이 많거나 사용량 한도에 닿았습니다. 잠시 뒤 다시 시도해 주세요.',invalid_json:'답을 읽지 못했습니다. 다시 시도해 주세요.',cancelled:'중지했습니다.',session_expired:'다시 로그인해 주세요.'}[e&&e.code]||'연결이 끊겼습니다. 다시 시도해 주세요.';ASK.ai={err:m,ev}}
  finally{ASK.busy=false;ASK.ctl=null;if(ASK.u)renderAsk()}
}
function aiHTML(){const a=ASK.ai;
  if(a.wait)return `<div class="verdict ai"><div class="lvl">Claude 판정 중…</div><div class="frm-note">근거 자료를 읽고 판단하고 있습니다. 30초~1분 정도 걸릴 수 있습니다. 처음 한 번은 Claude 사용 허락을 묻습니다.</div><button class="more" type="button" id="aistop">중지</button></div>`;
  if(a.err)return `<div class="verdict ai"><div class="lvl">Claude 판정</div><div class="frm-note">${esc(a.err)}</div><button class="more" type="button" data-askai="1">다시 시도</button></div>`;
  const r=a.r||{};const byId=Object.fromEntries((a.ev||[]).map(it=>[it.id,it]));
  const cites=new Set();const cite=ids=>(ids||[]).filter(id=>byId[id]).map(id=>{cites.add(id);return `<button class="cite" type="button" data-ev="${esc(id)}">${esc(id[0]==='R'?id.slice(1):byId[id].label.replace(/^카드 Q&A · /,''))}</button>`}).join('');
  const reasons=(Array.isArray(r.reasons)?r.reasons:[]).map(x=>`<li>${esc(x.text||'')} ${cite(x.cite)}</li>`).join('');
  return `<div class="verdict ai"><div class="lvl">Claude 판정 · 근거 자료 ${(a.ev||[]).length}건 검토</div><div class="big">${esc(r.verdict||'?')}</div><div>${esc(r.summary||'')}</div>${reasons?`<ol>${reasons}</ol>`:''}${r.caution?`<div class="frm-note">주의: ${esc(r.caution)}</div>`:''}<div class="frm-note">공식 판정이 아닌 근거 정리입니다. 대회 판정은 저지 확인을 거쳐 주세요.</div></div>`+
    [...cites].map(id=>`<div class="ev qa" id="ev-${esc(id)}" hidden><div class="src">${esc(byId[id].label)}</div><div style="white-space:pre-line">${esc(byId[id].text)}</div></div>`).join('')}

const EX=['BT14-033','EX8-029','BT22-007','BT21-061','【등장 시】【진화 시】상대의 디지몬 1마리를 레스트시킨다. 그 후, 상대의 턴 종료까지 상대의 디지몬 1마리는 액티브가 되지 않는다.','메탈그레이몬'];
$('exs').insertAdjacentHTML('beforeend',EX.map((e,i)=>`<button class="ex" type="button" data-ex="${i}">${esc(e.length>18?e.slice(0,18)+'…':e)}</button>`).join(''));
function intro(){out.innerHTML=`<section class="unit"><div><b>이렇게 쓰세요</b></div>
  <div class="note">① 카드 번호나 카드명을 넣으면 그 카드의 효과를 효과 단위로 나눠 보여 줍니다. ② 아직 리스트에 없는 카드나 상황 속 효과는 문구를 그대로 붙여 넣으세요. ③ 각 효과 아래에서 이 카드의 Q&amp;A → 같은 패턴 다른 카드의 Q&amp;A → 관련 종합 룰 조항 → 관련 일반 판정 순으로 근거를 확인할 수 있습니다.</div>
  <div class="legend"><span><span class="chip k">주황 칩</span> 효과 유형(행동)</span><span><span class="chip">패턴 #</span> 문구·결과가 같은 효과 묶음</span><span><span class="tag-est">자동 추정</span> 연결이 틀릴 수 있음</span></div>
  <div class="note">카드 ${Object.keys(D.cards).length.toLocaleString()}종 · 효과 ${U.length.toLocaleString()}개 · 카드 Q&amp;A ${QA.length.toLocaleString()}문항 · 종합 룰 Ver.4.3</div></section>
  <section class="unit"><div><b>질문 예시</b> <span class="note">누르면 카드를 열고 질문을 넣어 바로 판정합니다</span></div>
  ${[['확정','Q&A가 없는 카드에, 같은 효과 패턴의 다른 카드가 받은 질문을 던진 경우 · 공식 답과 비교해 보세요'],['참고','같은 패턴 선례가 여럿이고 답이 갈리는 경우'],['선례 없음','처음 보는 상황 · Claude가 판정합니다']].map(([lv,desc])=>
    `<details class="sec"${lv==='확정'?' open':''}><summary>${lv} <span class="n">${EXQ.filter(x=>x.level===lv).length}</span><span class="why">${desc}</span></summary><div class="list">${EXQ.map((x,i)=>x.level!==lv?'':`<div class="qa"><div class="src"><button type="button" data-qex="${i}">${esc(x.ask_card)} ${esc(x.ask_name)}에 질문하기 →</button></div><div class="q"><b>Q</b><span>${esc(x.q)}</span></div>${x.official?`<div class="a"><b>A</b><span>공식 답(${esc(x.src)}): ${esc(x.official)}</span></div>`:''}</div>`).join('')}</div></details>`).join('')}
  </section>`}
const EXQ=__EXQ__;
function runExample(i){const x=EXQ[i];$('q').value=label(x.ask_card);go();
  const sec=[...document.querySelectorAll('section.unit')].find(s=>s.querySelector('.utext')&&s.querySelector('.utext').textContent===x.effect);if(!sec)return;
  sec.querySelector('[data-ask]').click();$('askq').value=x.q;$('askq').dispatchEvent(new Event('input'));$('askgo').click();$('askp').scrollIntoView({block:'start'})}

function go(){run($('q').value);try{history.replaceState(null,'','#'+encodeURIComponent($('q').value.trim()).slice(0,0))}catch(e){}window.scrollTo(0,0)}
$('go').onclick=go;
/* ---------- card autocomplete: "코드번호 카드이름" ---------- */
const label=no=>no+' '+cname(no);
const CARD_LIST=Object.keys(D.cards).map(no=>{const nm=cname(no);return {no,nm,ty:D.cards[no][1],kno:no.toLowerCase().replace(/[-\s]/g,''),knm:nm.replace(/\s/g,'').toLowerCase()}});
const AC={items:[],act:-1};
function acSearch(t){
  const k=t.toLowerCase().replace(/\s/g,'');const kno=k.replace(/-/g,'').replace(/^(bt|ex|st|rb|lm|ad)0(\d)/,'$1$2');
  if(!k)return [];
  const sc=[];
  for(const c of CARD_LIST){let s=-1;
    if(c.kno===kno)s=0;else if(c.kno.startsWith(kno))s=1;else if(c.knm===k)s=0.5;else if(c.knm.startsWith(k))s=2;else if(c.knm.includes(k))s=3;else if(c.kno.includes(kno))s=4;
    if(s>=0)sc.push([s,c])}
  sc.sort((a,b)=>a[0]-b[0]||(a[0]>=2&&a[0]<4?a[1].nm.length-b[1].nm.length:0)||a[1].no.localeCompare(b[1].no,undefined,{numeric:true}));
  return sc.slice(0,12).map(x=>x[1]);
}
function hl(text,q){const k=q.replace(/\s/g,'');if(!k)return esc(text);const i=text.replace(/\s/g,'').toLowerCase().indexOf(k.toLowerCase());if(i<0)return esc(text);
  // map index in space-stripped string back to the original
  let a=-1,b=-1,n=0;for(let j=0;j<text.length;j++){if(/\s/.test(text[j]))continue;if(n===i)a=j;if(n===i+k.length-1){b=j+1;break}n++}
  return a<0||b<0?esc(text):esc(text.slice(0,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'+esc(text.slice(b))}
function acShow(){const q=$('q'),ul=$('ac');const t=q.value.trim();
  // effect text being pasted: no card suggestions
  if(!t||t.length>30||/[【《〔〈.]/.test(t)||t.includes('\n')){acHide();return}
  AC.items=acSearch(t.split(/\s+/)[0].length>=2&&/\d/.test(t)?t.split(/\s+/)[0]:t);AC.act=AC.items.length?0:-1;
  if(!AC.items.length){ul.innerHTML='<li class="hint">일치하는 카드가 없습니다 · 효과 문구라면 그대로 찾기를 누르세요</li>';ul.hidden=false;q.setAttribute('aria-expanded','true');return}
  ul.innerHTML=AC.items.map((c,i)=>`<li role="option" id="ac-${i}" data-ac="${i}" aria-selected="${i===AC.act}"><span class="cno">${hl(c.no,t)}</span><span class="cnm">${hl(c.nm,t)}</span><span class="cty">${esc(c.ty)}</span></li>`).join('');
  ul.hidden=false;q.setAttribute('aria-expanded','true');q.setAttribute('aria-activedescendant','ac-0')}
function acHide(){$('ac').hidden=true;$('q').setAttribute('aria-expanded','false');$('q').removeAttribute('aria-activedescendant');AC.items=[];AC.act=-1}
function acMove(d){if(!AC.items.length)return;AC.act=(AC.act+d+AC.items.length)%AC.items.length;
  document.querySelectorAll('#ac li[role=option]').forEach((li,i)=>li.setAttribute('aria-selected',i===AC.act));
  const el=$('ac-'+AC.act);if(el){el.scrollIntoView({block:'nearest'});$('q').setAttribute('aria-activedescendant','ac-'+AC.act)}}
function acPick(i){const c=AC.items[i];if(!c)return;$('q').value=label(c.no);acHide();go()}
$('q').addEventListener('keydown',e=>{
  const open=!$('ac').hidden&&AC.items.length;
  if(e.key==='ArrowDown'&&open){e.preventDefault();acMove(1)}
  else if(e.key==='ArrowUp'&&open){e.preventDefault();acMove(-1)}
  else if(e.key==='Escape'){acHide()}
  else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(open&&AC.act>=0)acPick(AC.act);else{acHide();go()}}
});
$('q').addEventListener('input',e=>{const t=e.target;t.style.height='44px';t.style.height=Math.min(200,t.scrollHeight)+'px';acShow()});
$('q').addEventListener('focus',()=>{if($('q').value.trim())acShow()});
$('q').addEventListener('blur',()=>setTimeout(acHide,150));
$('ac').addEventListener('mousedown',e=>{const li=e.target.closest('[data-ac]');if(li){e.preventDefault();acPick(+li.dataset.ac)}});
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-card]');if(c){$('q').value=D.cards[c.dataset.card]?label(c.dataset.card):c.dataset.card;go();return}
  const p=e.target.closest('[data-pat]');if(p){showPattern(+p.dataset.pat);window.scrollTo(0,0);return}
  const x=e.target.closest('[data-ex]');if(x){$('q').value=EX[+x.dataset.ex];$('q').dispatchEvent(new Event('input'));go();return}
  const m=e.target.closest('[data-more]');if(m){$(m.dataset.more).hidden=false;m.remove();return}
  const qx=e.target.closest('[data-qex]');if(qx){runExample(+qx.dataset.qex);return}
  const a=e.target.closest('[data-ask]');if(a){openAsk(ASKU[+a.dataset.ask]);return}
  const s=e.target.closest('[data-slot]');if(s){const k=+s.dataset.slot;ASK.manual.add(k);if(ASK.sl.has(k))ASK.sl.delete(k);else ASK.sl.add(k);s.setAttribute('aria-pressed',ASK.sl.has(k));return}
  const ai=e.target.closest('[data-askai]');if(ai){askClaude();return}
  if(e.target.id==='aistop'&&ASK.ctl){ASK.ctl.abort();return}
  const ev=e.target.closest('[data-ev]');if(ev){const el=$('ev-'+ev.dataset.ev);if(el){el.hidden=!el.hidden}}
});
document.body.insertAdjacentHTML('beforeend',`<datalist id="cardopts">${CARD_LIST.map(c=>`<option value="${esc(label(c.no))}"></option>`).join('')}</datalist>`);
intro();
})();
</script>
